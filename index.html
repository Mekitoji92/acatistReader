ă acesta mai desfătat decât cerurile s-a arătat;\nBucură-te, meșter înțelept care ai întrecut pe Solomon;\nBucură-te, că fiica ta s-a făcut Biserică a lui Dumnezeu;\nBucură-te, rădăcina pomului vieții;\nBucură-te, temelia turnului credinței;\nBucură-te, râu care ai adus pe mărgăritarul cel de mult preț;\nBucură-te, că pe acesta în Sfânta Sfintelor l-ai pus;\nBucură-te, cel ce ai primit făgăduința prin arhanghel;\nBucură-te, că prin aceasta s-a plinit sfatul cel mai înainte de veci;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul al 6-lea","p":["După zilele acelea, încredințându-se Ioachim că făgăduința cea dată lui prin arhanghel s-a plinit, aducând jertfă și arderi de tot, a fost binecuvântat de arhiereu, de preoți, de leviți și de tot poporul că s-a învrednicit de un dar mare că acesta și împreună au cântat lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 6-lea","p":["Apropiindu-se zorile mântuirii neamului omenesc, născut-ai, Sfântă și Preafericită Ana, pe prunca cea făgăduită ție de la Dumnezeu, pe pururea Fecioara Maria; pentru aceasta te lăudăm:\nBucură-te, ceea ce ai născut pe Împărăteasa cerului;\nBucură-te, lâna cea preacurată din care s-a țesut cortul împăratului;\nBucură-te, mijlocitoarea iertării și a darului;\nBucură-te, steaua Nazaretului cea mult luminoasă;\nBucură-te, podoaba Bisericii cea preafrumoasă;\nBucură-te, lauda patriarhilor și a drepților;\nBucură-te, maica nădejdii creștinilor;\nBucură-te, chivot purtător de tăblița darului;\nBucură-te, cuibul porumbiței raiului;\nBucură-te, stâlpul cel neclintit al Bisericii;\nBucură-te, reazemul cel nemărginit al credincioșilor;\nBucură-te, ceea ce ai născut pe cea făgăduită lumii;\nBucură-te, Ana, maică prealăudată!"],"r":[]},{"h":"Condacul al 7-lea","p":["Vrând dumnezeiasca Ana să-și plinească făgăduința, a adus pe prunca cea dăruită ei de Dumnezeu în Biserica Domnului și în Sfânta Sfintelor a așezat-o pe ea, ca ziua și noaptea să cânte lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 7-lea","p":["Arătat-a făptură nouă Stăpânul tuturor, din dreptul Ioachim răsărind pe înnoitoarea Evei și mielușeaua cea mai înainte vestită de prooroci; pentru aceea auzi de la noi așa:\nBucură-te, păstrătorul tainelor celor nespuse ale lui Dumnezeu;\nBucură-te, plinitorul sfaturilor Lui celor nepătrunse;\nBucură-te, lucrătorul cămării de mire celei preacurate;\nBucură-te, părintele miresei celei cu totul neîntinate;\nBucură-te, că fiica ta a născut pe Hristos Domnul;\nBucură-te, că tu pentru aceasta de toată lumea ești lăudat;\nBucură-te, plinitorule al Legii;\nBucură-te, începătorule al darului;\nBucură-te, grabnic ajutător al celor neroditori;\nBucură-te, călduros mijlocitor al păcătoșilor;\nBucură-te, temelia cea neclintită a Bisericii;\nBucură-te, pavăza cea nebiruită a credinței;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul al 8-lea","p":["Văzând nașterea din făgăduință dăruită de Dumnezeu lui Ioachim și Anei, să ne ridicăm mintea la cer și să cântăm cu bucurie laudă Celui care a arătat cele preaslăvite, zicând: Aliluia!"],"r":[]},{"h":"Icosul al 8-lea","p":["Cu totul după legile firii a fost nașterea ta, Ana Prealăudată; dar fiica ta, născând pe Dumnezeu-Cuvântul, a rămas fecioară; pentru aceasta te lăudăm pe tine, zicând:\nBucură-te, ceea ce ai născut pe lauda fecioriei;\nBucură-te, că prin fiica ta s-a plătit datoria strămoașei;\nBucură-te, că ai purtat în brațele tale pe fiica Părintelui ceresc;\nBucură-te, că printr-însa s-a făcut mântuirea neamului omenesc;\nBucură-te, că din sânii tăi ai hrănit pe Împărăteasa făpturii;\nBucură-te, ceea ce ai născut după făgăduință pe Maica luminii;\nBucură-te, liman de scăpare a celor credincioși;\nBucură-te, grabnică tămăduire a celor neputincioși;\nBucură-te, lauda cea preamărită a dreptcredincioșilor;\nBucură-te, podoaba preastrălucită a arhiereilor;\nBucură-te, munte înalt care nu te ascunzi de la năzuința noastră;\nBucură-te, acoperământul celor ce se roagă ție cu credință;\nBucură-te, Ana, maică prealăudată!"],"r":[]},{"h":"Condacul al 9-lea","p":["Nu pricepem de unde vom începe a-ți aduce laudă, maică preafericită, sau cu ce cununi te vom încununa pe tine, care ai născut pe Împărăteasa cerului și a pământului; numai să lăudăm cu umilință pe Dumnezeul minunilor, cântând: Aliluia!"],"r":[]},{"h":"Icosul al 9-lea","p":["Zicerile sfinților prooroci cele din descoperire dumnezeiască văzându-le plinite și stând lângă scaunul Dumnezeirii, preafericite Ioachim, auzi-ne pe noi, care grăim ție:\nBucură-te, că te desfătezi cu heruvimii în lumina cea necuprinsă;\nBucură-te, că vezi scaunul cel preaînalt dăruit fiicei tale;\nBucură-te, că dânsa a fost învrednicită a ședea de-a dreapta Fiului său;\nBucură-te, locuitorul Ierusalimului celui de sus;\nBucură-te, cel ce nu ne uiți pe noi, rudele tale cele de jos;\nBucură-te, cel ce petreci cu arhanghelii;\nBucură-te, împreună-vorbitorule cu apostolii;\nBucură-te, veselia mucenicilor și a cuvioșilor;\nBucură-te, lauda patriarhilor și a proorocilor;\nBucură-te, luminătorul Legii și al darului;\nBucură-te, vestitorule de bucurie celor din ascunzătorile iadului;\nBucură-te, cel prin care începe plinirea făgăduinței de mântuire;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul al 10-lea","p":["Vrând să mântuiască lumea împodobitorul tuturor, în lume, căreia fusese făgăduit, a venit; și întrupându-Se din sângiuirile cele preacurate ale fiicei tale celei cu totul nevinovate, Preafericite Ioachime, ne-a răscumpărat pe noi din robia diavolului; pentru aceasta cântăm cu bucurie: Aliluia!"],"r":[]},{"h":"Icosul al 10-lea","p":["Zid de apărare ești credincioșilor și turn de scăpare tuturor celor ce aleargă la tine, Ana, cea cu nume de împărăteasă; că prin mijlocirea ta se mântuiesc cei ce te laudă pe tine, zicând:\nBucură-te, ceea ce în chip nemijlocit vezi frumusețea Dumnezeirii;\nBucură-te, ceea ce necontenit sădești pentru noi darul mântuirii;\nBucură-te, că de nașterea ta s-au îngrozit puterile iadului;\nBucură-te, că printr-însa s-au deschis nouă ușile raiului;\nBucură-te, că vezi întru veselie pe fiica ta cea preabinecuvântată;\nBucură-te, că, născând-o pe ea, de toată lumea ești prealăudată;\nBucură-te, ceea ce ai crescut pe vița cea adevărată;\nBucură-te, că aceasta a odrăslit pe strugurele vieții;\nBucură-te, fântână de daruri izvorâtoare;\nBucură-te, rază aducătoare de bucurie;\nBucură-te, ceea ce ai născut căruța cea purtătoare de fulger;\nBucură-te, că ai purtat scaunul cel împodobit cu chipul Soarelui;\nBucură-te, Ana, maică prealăudată!"],"r":[]},{"h":"Condacul al 11-lea","p":["Pereche preafrumoasă și însoțire de Dumnezeu aleasă, Ioachim și Ana, cei ce sunteți acum străluciți cu dumnezeiască lumină și vă veseliți cu îngerii și împreună cu fiica voastră cea de Dumnezeu dăruită, aduceți-vă aminte de noi cei de pe pământ, care cântăm: Aliluia!"],"r":[]},{"h":"Icosul al 11-lea","p":["Sfeșnic purtător de lumină te are Biserica pe tine, dumnezeiescule Părinte Ioachim, care îndreptezi spre cunoștința cea dumnezeiască pe toți cei ce cu dor te laudă pe tine, zicând:\nBucură-te, luminătorul celor ce sunt în întunericul necunoștinței;\nBucură-te, cârmuitorul cel bun al celor ce înoată în marea vieții;\nBucură-te, grabnicule ajutător al celor ce sunt în primejdii;\nBucură-te, dulce mângâietor al celor întristați;\nBucură-te, cel ce ușurezi necazurile vieții celei grele de purtat;\nBucură-te, ajutătorul cel preaînalt al mântuirii;\nBucură-te, nădejdea neînfruntată a celor ce te cheamă pe tine;\nBucură-te, îndemnătorul celor însoțiți către fapte bune;\nBucură-te, temelia însoțirii celei de Dumnezeu rânduite;\nBucură-te, rădăcina mlădiței celei neveștejite;\nBucură-te, iertarea celor ce mult au greșit;\nBucură-te, ridicarea strămoșilor;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul al 12-lea","p":["Podoabă de mare cuviință a câștigat Biserica prin pomenirea voastră, prealăudaților părinți; pentru aceea vă rugăm, pomeniți-ne pe noi înaintea lui Dumnezeu, și din toate nevoile izbăviți-ne pe noi, cei ce cu dragoste vă lăudăm pe voi, cântând lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 12-lea","p":["Lăudând nașterea ta cu cântări de Dumnezeu insuflate, Ana, de trei ori fericită, slăvim pe Cel ce cu un dar ca acesta te-a învrednicit pe tine și cu dragoste grăim ție:\nBucură-te, ceea ce ai odrăslit pe vița mlădiței celei neveștejite;\nBucură-te, că ai născut pe Maica Luminii celei de negrăit;\nBucură-te, ceea ce mijlocești nouă bunătățile cerești;\nBucură-te, ceea ce ești dăruitoare îmbelșugată și de cele pământești;\nBucură-te, lauda cea mult-strălucită a femeilor;\nBucură-te, cununa cea neveștejită a maicilor;\nBucură-te, născătoarea prealăudată a Maicii lui Dumnezeu;\nBucură-te, soție bineplăcută lui Dumnezeu;\nBucură-te, ascultătoare blândă a celor ce te cheamă pe tine;\nBucură-te, cea care împlinești cererile cele bune ale credincioșilor;\nBucură-te, bogăția săracilor și a văduvelor;\nBucură-te, ceea ce ești vindecare a neputincioșilor și a bolnavilor;\nBucură-te, Ana, maică prealăudată!"],"r":[]},{"h":"Condacul al 13-lea","p":["O, preafericită însoțire a dumnezeieștilor Părinți Ioachim și Ana, cei ce stați lângă scaunul Dumnezeirii, primind laudele acestea ale noastre, izbăviți-ne cu rugăciunile voastre de chinurile cele veșnice și de toată ispita, ca împreună cu voi să cântăm lui Dumnezeu: Aliluia! (acest condac se zice de trei ori)"],"r":["Apoi se zice Icosul 1 și Condacul 1"]},{"h":"Icosul 1","p":["Îngerul cel mai întâistătător din cer a fost trimis să spună vestirea de bucurie Dreptului Ioachim, zicând: „Ioachime, Ioachime, auzitu-s-a rugăciunea ta; și iată, femeia ta va naște ție o fiică de care cerul și pământul se vor bucura”, lăudându-te pe tine și zicând:\nBucură-te, Ioachime, mângâierea lui Adam celui căzut;\nBucură-te, mijlocitorul iertării celui greșit;\nBucură-te, că rugăciunile tale au străbătut cerurile;\nBucură-te, că darul cel mai presus de lume ai dobândit;\nBucură-te, că de aceasta Anei grăbindu-te ai vestit;\nBucură-te, că și acesteia, de asemenea, i s-au descoperit;\nBucură-te, luminătorul cel cu raze veselitoare;\nBucură-te, aducătorule de roadă mântuitoare;\nBucură-te, că ai odrăslit din seminție împărătească;\nBucură-te, că ai mărit vrednicia arhierească;\nBucură-te, cel ce ai întrecut cu darul pe Avraam;\nBucură-te, cel prin care întristarea nerodirii s-a pierdut;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul 1","p":["Însoțirii celei de Dumnezeu alese, dumnezeieștilor Părinți Ioachim și Ana, ca celor ce ați născut pe Maica Vieții noastre, binecuvântată de Dumnezeu Născătoarea și Pururea Fecioara Maria, cântări de laudă aducem vouă noi, rugătorii voștri; iar voi, ca cei ce aveți îndrăzneală către Dumnezeu, păziți-ne cu rugăciunile voastre de toate primejdiile pe noi, cei ce cântăm: Bucurați-vă, părinți de trei ori fericiți!"],"r":[]}]},{"slug":"stelian","title":"Acatistul Sfântului Cuvios Stelian Paflagonul","short":"Sf. Stelian","source":"https://doxologia.ro/acatistul-sfantului-cuvios-stelian-paflagonul-ocrotitorul-pruncilor","sections":[{"h":"Condacul 1","p":["Iubite al lui Hristos, făcătorule de minuni, grabnic ajutătorule al nostru, Cuvioase Părinte, slăvind pe Dumnezeu, Cel ce te-a sfințit pe tine din sânul maicii tale, cele de laudă aducem ție. Din toate nevoile scapă-ne pe noi, cei ce grăim către tine: Bucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Icosul 1","p":["Făcătorul îngerilor și al oamenilor te-a ales pe tine dintru început ca să preamărești cu viața ta îngerească numele Sfintei Treimi, și lepădând purtarea de grijă a lumii, ca o rază prealuminoasă a Soarelui dreptății strălucind viața ta, noi, privind preacinstitele tale nevoințe, cu smerenie și cu bucurie zicem unele ca acestea:\nBucură-te, cinstea Bisericii Sfinte;\nBucură-te, stâlpul cel puternic al Paflagoniei;\nBucură-te, rugătorul cel mare al pustiei;\nBucură-te, îndreptătorul credinței și al iubirii;\nBucură-te, chipul cel blând al smereniei;\nBucură-te, mângâierea credincioșilor;\nBucură-te, îndreptătorul cel bun al păcătoșilor;\nBucură-te, alinarea cea blândă a bolnavilor;\nBucură-te, lauda cea curată a credincioșilor;\nBucură-te, îngrădirea cea lină a pustnicilor;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 2-lea","p":["Văzându-te pe tine Dumnezeu a fi seminție sfântă și aleasă, de la sânul maicii tale te-a sfințit pe tine și vas al Sfântului Duh te-a arătat. Îndreptându-ți viața spre însingurare, cu Sfânta Cruce pe care ai purtat-o până la sfârșitul vieții, ai însemnat dragostea cea mare pentru noi a lui Hristos-Dumnezeu, Căruia Îi aduci cântare: Aliluia!"],"r":[]},{"h":"Icosul al 2-lea","p":["Înțelegere cerească s-a dăruit ție, Părinte Stelian, că din tinerețile tale necontenit ai cugetat la cele înalte și, împărțind averea ta la săraci, ai aflat adăpostire peștera întunecată, pe care luminând-o cu sfintele tale rugăciuni, auzi de la noi unele ca acestea:\nBucură-te, lauda cea vestită a pământului Paflagoniei;\nBucură-te, strălucirea monahilor cea dorită;\nBucură-te, floarea cuvioșiei de Dumnezeu împodobită;\nBucură-te, frumusețea sfinților cea strălucită;\nBucură-te, cel ce pentru Domnul Hristos lumea ai părăsit;\nBucură-te, cel ce în peșteră ai locuit;\nBucură-te, că din tinerețe lui Dumnezeu ai urmat;\nBucură-te, că, în viață fiind, de trup te-ai depărtat;\nBucură-te, cel ce până la moarte cu Crucea Domnului ai biruit;\nBucură-te, cel ce numai pe Hristos în tot locul și în tot chipul L-ai slujit;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 3-lea","p":["Spre tine nădăjduind, de multe boli sufletești și trupești ne-ai tămăduit și ne-ai ferit de primejdii și necazuri pe noi, cei care ne rugăm ție. Năzuind la tine, cu lacrimi cerem să duci la tronul Celui Preaînalt rugăciunile celor ce slăvesc pe Dumnezeu cântând: Aliluia!"],"r":[]},{"h":"Icosul al 3-lea","p":["Având osârdie spre lupta vieții monahicești și iubind sihăstria, într-o peșteră luminată doar de dragostea lui Dumnezeu ți-ai făcut chilie și acolo hrană de la înger ai primit, sfârșindu-ți viața cea bineplăcută lui Dumnezeu în nevoințe, în post și în rugăciune. Iar noi, minunându-ne de ostenelile tale cele sfinte, aducem aceste cântări:\nBucură-te, cel ce de cele pieritoare te-ai lepădat;\nBucură-te, că de Împărăția cerească cu dorul inimii ai fost legat;\nBucură-te, că pe Hristos Domnul cu toată inima L-ai iubit;\nBucură-te, cel ce mintea și inima prin rugăciune întru Domnul le-ai întărit;\nBucură-te, înțelepte al înțelepților luminător;\nBucură-te, cald binevestitor al bucuriei cerești;\nBucură-te, izvorul de viață purtător al pustiei;\nBucură-te, glasul cel puternic risipitor al trândăviei;\nBucură-te, grabnicule mângâietor al necazurilor și al durerilor sufletești;\nBucură-te, grabnicule tămăduitor al suferințelor trupești;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 4-lea","p":["Viforul ispitelor celor rele alungând, ai trecut calea cea strâmtă și cu suferințe de multe feluri, purtând jugul lui Hristos, jugul tăcerii și al privegherii de multe nopți, cu darul lui Dumnezeu te-ai suit pe calea desăvârșirii, învrednicindu-te ca împreună cu îngerii să slăvești pe Dumnezeu cântându-I: Aliluia!"],"r":[]},{"h":"Icosul al 4-lea","p":["Auzind și văzând viața ta cea curată și sfântă, Sfinte Părinte Stelian, toată ceata monahilor din țara Paflagoniei s-a minunat și s-a întrecut în a te lăuda pe tine; iar noi, credincioșii cu credință și bucurie grăim așa:\nBucură-te, cel ce la înălțimea sfințeniei ai ajuns;\nBucură-te, crin ales cu bună mireasmă al pustiei;\nBucură-te, cel ce ești a cerului minune și vas de cinste al Bisericii lui Hristos;\nBucură-te, ostașule al lui Hristos cu daruri cerești înarmat;\nBucură-te, înainte rugător al nostru la tronul Marelui Împărat;\nBucură-te, slugă bună a Domnului cel spre bine folositor;\nBucură-te, ostenitorule preaplăcut al lui Dumnezeu;\nBucură-te, sprijinitorul nostru cel tare și grabnic ajutător;\nBucură-te, că lui Hristos Domnul cu smerenie ai slujit;\nBucură-te, că ai întărit pe credincioși în rugăciunile lor;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 5-lea","p":["Năprasnica moarte a pruncilor ai contenit, Sfinte Stelian, punându-i în afară de primejdie și de moarte prin chemarea numelui tău și prin zugrăvirea icoanei tale; și atunci maicile cele mâhnite s-au bucurat de vederea fiilor lor și au slăvit pe Dumnezeu cântând: Aliluia!"],"r":[]},{"h":"Icosul al 5-lea","p":["Mâhnirea maicilor în bucurie ai prefăcut, Sfinte Stelian, dând lor naștere de prunci buni și ridicând din boli pe cei bolnavi cu rugăciunile tale, ca cel ce ai în tine sălășluirea harului dumnezeiesc; pentru aceasta noi, credincioșii, cunoscând faptele tale cele minunate și sfinte, cântăm către tine așa:\nBucură-te, cel ce cu blândețea ai depărtat duhul cel rău;\nBucură-te, că ai mângâiat pe maicile mâhnite de boala fiilor lor;\nBucură-te, că ai ridicat din boli pe mulți prunci;\nBucură-te, că prin aceasta ocrotitor al copiilor te-ai arătat;\nBucură-te, că la tine copiii neîncetat au alergat;\nBucură-te, că lucrător al dragostei lui Dumnezeu te-ai arătat prin faptele tale;\nBucură-te, liniștirea celor înfricoșați;\nBucură-te, pururea ajutător al familiilor noastre;\nBucură-te, pururea ocrotitor al pruncilor;\nBucură-te, pustnice, înarmat cu daruri cerești;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 6-lea","p":["Ținutul Paflagoniei laudă și astăzi luptele și nevoințele tale, Sfinte Stelian; că locurile cele neumblate ale pustiei, cu rugăciunile tale, le-ai umplut de bună mireasmă, ca un alt Ilie Tesviteanul, odraslă pustiei arătându-te; pentru aceasta, laudă aducem lui Dumnezeu și cântăm: Aliluia!"],"r":[]},{"h":"Icosul al 6-lea","p":["Ca un luceafăr strălucind, întunericul necredinței ai risipit, și cu numele tău cel sfințit pe mulți din umbra păcatului la lumina mântuirii i-ai ridicat; pentru aceasta și darul de a face minuni de la Domnul ai primit. Pentru ale tale osteneli și daruri duhovnicești cântăm către tine așa:\nBucură-te, văzătorule de Dumnezeu prealuminat;\nBucură-te, lăcaș preaînfrumusețat al Sfântului Duh;\nBucură-te, prin care se împodobesc cuvioșii;\nBucură-te, prin care se întăresc credincioșii;\nBucură-te, că ai gustat dulceața raiului, aflându-te în trup stricăcios;\nBucură-te, că te-ai îndulcit de pâinea vieții;\nBucură-te, că te-ai adăpat cu apa vieții;\nBucură-te, că ne-ai arătat nouă calea la cer;\nBucură-te, focule care arzi taberele demonilor;\nBucură-te, mângâierea celor întristați;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 7-lea","p":["Toată firea omenească s-a minunat de viața ta cea însingurată, Sfinte Stelian, îmbrăcat fiind în haina smereniei celei adevărate și de la Domnul învrednicindu-te de mari daruri; pentru aceea, împreună cu tine slăvim pe Dumnezeu cântând: Aliluia!"],"r":[]},{"h":"Icosul al 7-lea","p":["Arătat-a făptură nouă Stăpânul tuturor prin tine, Sfinte, prin tine, care toată viața pentru Domnul Hristos în pustie ai petrecut, cu smerenie gândind spre cele înalte și cu rugăciunea izvor de daruri îmbelșugând. Iar noi, cei întunecați cu grijile și patimile, cu umilință lăudăm dragostea ta cea curată și sfântă pentru Dumnezeu și cu bucurie cântăm către tine așa:\nBucură-te, trandafir înmiresmat cu mirosul cel de taină;\nBucură-te, izvor nesecat de bunătate;\nBucură-te, rugător fierbinte pentru cei cuprinși de patimi;\nBucură-te, păstorul nostru cel preabun;\nBucură-te, părintele nostru cel milostiv și blând;\nBucură-te, vindecătorul suferințelor noastre;\nBucură-te, călăuzitorul vieții noastre;\nBucură-te, mângâietorul sufletelor întristate;\nBucură-te, liniștitorul sufletelor tulburate;\nBucură-te, ridicarea celor căzuți în păcat;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 8-lea","p":["În trup fiind tu încă, toți s-au bucurat de îngereasca ta viață, iar acum, în slăvile cerești fiind, înaintea Împăratului Hristos stând, nu ne uita pe noi, cei ce săvârșim pomenirea ta; ci te roagă pentru noi, cerând pentru noi iertare de păcate și împărtășire de veșnicele bunătăți, ca să cântăm împreună cu tine în veci: Aliluia!"],"r":[]},{"h":"Icosul al 8-lea","p":["Văzându-te pe tine vas ales al Sfântului Duh, din locuri îndepărtate au alergat mulțimile de credincioși și de la tine au cerut ajutor; cărora vindecări revărsând, auzi de la noi unele ca acestea:\nBucură-te, rugătorule spre mântuire al celor ce te cinstesc;\nBucură-te, tămăduirea celor bolnavi și a celor suferinzi;\nBucură-te, cel ce ai biruit cu rugăciunea săgețile vrăjmașului;\nBucură-te, că Dumnezeu a sălășluit în inima ta curată;\nBucură-te, că nevoințele tale pe îngeri au veselit;\nBucură-te, că prin ele pe cel rău ai biruit;\nBucură-te, că ai izbăvit pe credincioși de vrăjmași cu rugăciunile tale;\nBucură-te, stâlpul cel drept al monahilor;\nBucură-te, cinstea și podoaba credincioșilor;\nBucură-te, cel ce te rogi necontenit pentru toți către Dumnezeu;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 9-lea","p":["Când ai ajuns la sfârșitul ostenelilor tale cele mântuitoare, Sfinte Stelian, ți-ai încredințat sufletul tău curat în mâinile lui Dumnezeu; iar Sfinții Îngeri l-au purtat la tronul cel mai presus de ceruri, cântând cântare de laudă către Dumnezeu, Care este minunat întru Sfinții Lui: Aliluia!"],"r":[]},{"h":"Icosul al 9-lea","p":["Înțelepții cei binevorbitori nu pot lăuda cum se cuvine puterea dragostei tale către Dumnezeu, că ai miluit cu rugăciunea și cu fapta, arătându-te bună călăuzire celor rătăciți, bolnavilor tămăduire, maicilor rămase fără de prunci mângâiere; iar noi, bucurându-ne de darul acesta minunat dat ție, cu mulțumire cântăm:\nBucură-te, că din lume în pustie te-ai ascuns ca pe Dumnezeu să-L lauzi;\nBucură-te, că și acum nu încetezi a te ruga pentru noi;\nBucură-te, că Dumnezeu ți-a dat ție darul facerii de minuni;\nBucură-te, că pe maicile mâhnite de moartea pruncilor cu rodire iarăși le-ai mângâiat;\nBucură-te, că te-ai arătat tămăduitor de multe patimi;\nBucură-te, doctor grabnic tămăduitor;\nBucură-te, ajutătorul nostru cel fierbinte;\nBucură-te, cel ce aperi pe prunci de boli;\nBucură-te, mare folositor al celor ce-ți poartă numele;\nBucură-te, grabnicule ajutător al celor ce te cinstesc pe tine;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 10-lea","p":["Având îndrăzneală către Hristos, Dumnezeul nostru, pe Acesta roagă-L, Sfinte Stelian, pentru noi, cei ce săvârșim cu dragoste pomenirea ta, preaslăvind pe Dumnezeu și cântând: Aliluia!"],"r":[]},{"h":"Icosul al 10-lea","p":["Cu smerenie ne închinăm lui Dumnezeu și cu credință sărutăm sfântă icoana ta, Sfinte Părinte Stelian; și sufletul nostru și trupul nostru primesc ajutor și izbăvire de patimi, de ispite și de primejdii; pentru aceasta te lăudăm cântând:\nBucură-te, mirul cel bine mirositor al lui Hristos;\nBucură-te, că ale tale rugăciuni sunt bineprimite;\nBucură-te, că prin ele credincioșii primesc har;\nBucură-te, cel ce biruiești ispitele de tot felul;\nBucură-te, cel ce dorești mântuirea sufletelor noastre;\nBucură-te, curățitorule de patimi al trupurilor noastre;\nBucură-te, ocrotitorul celor din primejdii;\nBucură-te, că tu ne ești apărător la Judecată;\nBucură-te, cel ce prin împărtășire ești fiu al lui Dumnezeu;\nBucură-te, înălțarea credincioșilor spre mântuire;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 11-lea","p":["Sfinte Părinte Stelian, tu, care toată viața te-ai arătat împlinitor al poruncilor Domnului, dă-ne și nouă ajutor, ca să fim lucrători poruncilor Sale și, moștenitori ai Împărăției cerurilor făcându-ne, să cântăm împreună cu tine în veci: Aliluia!"],"r":[]},{"h":"Icosul al 11-lea","p":["Veniți, toți credincioșii, să ne închinăm în biserica Domnului și să ne rugăm Sfântului Stelian, căruia, cinstindu-l cu cântări duhovnicești și cu făclii aprinse, să-i cântăm așa:\nBucură-te, înger de trup purtător;\nBucură-te, om cu îngerii vorbitor;\nBucură-te, că viața toată Domnului o ai închinat;\nBucură-te, că prin aceasta slugă bună a Domnului te-ai arătat;\nBucură-te, că tu cununa nemuririi de la Dumnezeu ai primit;\nBucură-te, că cereasca fericire cu toți Sfinții ai moștenit;\nBucură-te, că de acolo pe noi ne priveghezi;\nBucură-te, că prin rugăciunile tale pe noi ne întărești;\nBucură-te, că și acum la ajutorul tău alergăm;\nBucură-te, învățătorul tinerilor și sprijinitorul bătrânilor;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 12-lea","p":["Lăudând proslăvirea ta, te fericim toți credincioșii, Sfinte Părinte Stelian, lauda Bisericii și podoaba monahilor; roagă pe Milostivul Dumnezeu să ocrotească Biserica și pe credincioșii robii Săi de toată reaua întâmplare; ocrotește casele noastre cu căldura rugăciunilor tale, ca împreună să cântăm cântare sfântă: Aliluia!"],"r":[]},{"h":"Icosul al 12-lea","p":["Ca un trandafir neveștejit, cu buna mireasmă a darului lui Dumnezeu ai umplut, Sfinte Părinte, marginile lumii; umple de bună mireasmă duhovnicească pe cei ce prăznuiesc pomenirea ta și ți-au alcătuit laude ca acestea:\nBucură-te, cel ce cu iubirea ta pe credincioși ai luminat;\nBucură-te, cel ce cu dar dumnezeiesc pe bolnavi ai vindecat;\nBucură-te, izvor nesecat al laudei celei sfinte;\nBucură-te, desfătarea celor minunate și negrăite;\nBucură-te, alinarea cea dulce a pruncilor celor iubiți;\nBucură-te, că pe toți îi mângâi, făcându-i fericiți;\nBucură-te, că toți primim îndemnurile tale;\nBucură-te, că urmându-ți pilda vieții ne mântuim;\nBucură-te, mângâierea celor ce cer la tine ajutor;\nBucură-te, sprijin și Sfânt ocrotitor al creștinilor;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul al 13-lea","p":["O, preafericite, Sfinte și făcătorule de minuni Părinte Stelian, primind această puțină rugăciune ce se înalță întru lauda ta, mijlocește la Bunul Dumnezeu pentru noi, cei ce te cinstim pe tine, iertare de păcate să ne dăruiască, sănătate nouă și copiilor noștri, pace lumii și liniște caselor noastre, ale celor ce slăvim pe Dumnezeu și cântăm: Aliluia! (acest condac se zice de trei ori)"],"r":["Apoi se zice Icosul 1 și Condacul 1"]},{"h":"Icosul 1","p":["Făcătorul îngerilor și al oamenilor te-a ales pe tine dintru început ca să preamărești cu viața ta îngerească numele Sfintei Treimi, și lepădând purtarea de grijă a lumii, ca o rază prealuminoasă a Soarelui dreptății strălucind viața ta, noi, privind preacinstitele tale nevoințe, cu smerenie și cu bucurie zicem unele ca acestea:\nBucură-te, cinstea Bisericii Sfinte;\nBucură-te, stâlpul cel puternic al Paflagoniei;\nBucură-te, rugătorul cel mare al pustiei;\nBucură-te, îndreptătorul credinței și al iubirii;\nBucură-te, chipul cel blând al smereniei;\nBucură-te, mângâierea credincioșilor;\nBucură-te, îndreptătorul cel bun al păcătoșilor;\nBucură-te, alinarea cea blândă a bolnavilor;\nBucură-te, lauda cea curată a credincioșilor;\nBucură-te, îngrădirea cea lină a pustnicilor;\nBucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Condacul 1","p":["Iubite al lui Hristos, făcătorule de minuni, grabnic ajutătorule al nostru, Cuvioase Părinte, slăvind pe Dumnezeu, Cel ce te-a sfințit pe tine din sânul maicii tale, cele de laudă aducem ție. Din toate nevoile scapă-ne pe noi, cei ce grăim către tine: Bucură-te, Sfinte Stelian, mare făcător de minuni!"],"r":[]},{"h":"Rugăciune către Sfântul Cuvios Stelian Paflagonul, ocrotitorul pruncilor","p":["Sfinte Părinte Stelian, sprijinitorul și călăuzitorul în rugăciunile noastre, patimile trupești biruind și împreună cu îngerii locuind, privești neîncetat mărirea cea gătită Sfinților, de lumina cerească umplându-te. Acum, în mărirea cerească viețuind și înaintea Împăratului Hristos stând, nu uita pe credincioșii care cu îndrăzneală înalță rugăciuni și cer sprijinul tău. Cel ce de la sânul maicii tale ai fost sfințit, și vas ales al Duhului Sfânt te-ai arătat, luând sub ocrotirea ta pe mame și pe copii, ferindu-i de întristare și de boală, arată-te grabnic vindecător al suferințelor și al bolilor sufletești și trupești ale celor ce te laudă pe tine. Cel ce din pustiul Paflagoniei ai făcut loc de preamărire a Sfintei Treimi, fă și din pustiul inimilor noastre țarină bineplăcută a harului dumnezeiesc, în care să înflorească crinii cei mântuitori ai credinței și să se înmulțească roadele sfințitoare ale faptelor bune; ocrotește cu rugăciunile tale familiile și pe copiii noștri, cerând de la Milostivul Dumnezeu iertare de păcate, sănătate și mântuire, ca prin tine și împreună cu tine să lăudăm numele cel sfânt al Tatălui și al Fiului și al Sfântului Duh. Amin."],"r":[]}]},{"slug":"efrem","title":"Acatistul Sfântului Mucenic Efrem cel Nou","short":"Sf. Efrem cel Nou","source":"https://doxologia.ro/acatistul-sfantului-mucenic-efrem-cel-nou","sections":[{"h":"Condacul 1","p":["Strălucitu-ne-ai tuturor ca o nouă stea, când s-au descoperit sfintele tale moaște, Părinte, iar cu strălucirea minunilor tale luminezi întreaga lume. Prin mila și smerenia ta, plinește cererile celor care se apropie cu credință și care îți strigă ție: Bucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Icosul 1","p":["Ca un înger nemaivăzut ai fost trimis din Cer și ne-ai arătat nouă harul Preasfântului Duh, cu care îi mângâi pe toți credincioșii, Sfinte Mucenice Efrem. Pentru aceasta, preafericit te numim și îți strigăm ție:\nBucură-te, că odinioară lupta cea bună ai purtat\nBucură-te, că acum tu strălucești prealuminat\nBucură-te, cel ce ne dăruiești nouă veselie\nBucură-te, că pricinuiești în Ceruri bucurie\nBucură-te, stea cu totul nouă a Bisericii lui Hristos-Dumnezeu\nBucură-te, sabie cu două tăișuri împotriva nebuniei celui rău\nBucură-te, că tuturor te-ai făcut pildă de sfântă nevoință\nBucură-te, că în ale tale lupte ai dobândit cununi de biruință\nBucură-te, întărirea cea nouă a credinței\nBucură-te, rana și surparea necredinței\nBucură-te, că ești putere dăruită celor credincioși\nBucură-te, că preschimbi inimile celor necredincioși\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 2-lea","p":["Viața ta sfântă și sfârșitul preafericit au fost neștiute de oameni, dar prin descoperirea sfintelor tale moaște, Preafericite Efrem, te-ai făcut cunoscut până la marginile pământului, îndemnându-i pe toți să laude dumnezeiasca iconomie și să cânte Preasfintei Treimi: Aliluia!"],"r":[]},{"h":"Icosul al 2-lea","p":["Dobândind noi cunoștința dumnezeiască a vieții tale întru Domnul, prin arătarea sfintelor tale oseminte, lăudăm pe Cel care te-a proslăvit prin mulțime mare de minuni, Preafericite Efrem. Prin ele, tu dăruiești mângâiere celor care îți cântă cu umilință:\nBucură-te, că lui Hristos-Dumnezeu Îi ești slujitor\nBucură-te, că al luminii nematerialnice ești văzător\nBucură-te, următor plin de sârg al nevoinței pustnicești\nBucură-te, fierbinte râvnitor al luptelor mucenicești\nBucură-te, vas preacurat, ce ai primit dumnezeiască insuflare\nBucură-te, floare sfântă răspândind tainică înmiresmare\nBucură-te, înțelepte care ai lepădat deșertăciunea cea lumească\nBucură-te, căci în chip tainic ai văzut lumea cea cerească\nBucură-te, căci mulțime de înviforări ai potolit\nBucură-te, că dorirea cea bună a duhului ți-ai hrănit\nBucură-te, că prin dragostea ta sfântă pavăză ne ești\nBucură-te, că înșelăciunile diavolești tu le stârpești\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 3-lea","p":["Prin sfintele tale arătări, ai descoperit celor ce te-au văzut, o, Sfinte Efrem, mucenice al Domnului, slava cea ascunsă pe care ai dobândit-o de la Dumnezeu. Iar prin mulțimea minunilor umpli de nădejde pe toți cei ce strigă Domnului cu credință: Aliluia!"],"r":[]},{"h":"Icosul al 3-lea","p":["Ai strălucit odinioară pe colina neprihăniților, arătându-te plăcut lui Hristos prin sfântă viețuire, iar acum, Sfinte, sfințești cu sfintele tale moaște mănăstirea ta, care se veselește duhovnicește și îți strigă:\nBucură-te, luminător preastrălucit al isihiei\nBucură-te, chip al cumpătării și trezviei\nBucură-te, căci veselești mințile cele credincioase\nBucură-te, că amesteci cugetele inimilor necredincioase\nBucură-te, că veșmintele sufletului tău sunt cu sânge împurpurate\nBucură-te, căci cu pecetea mucenicească faptele ți-s încrustate\nBucură-te, căci caznele păgânilor le-ai îndurat cu răbdare\nBucură-te, că ai râvnit să dobândești cununile nepieritoare\nBucură-te, far străluminat ce ne scoți la neclătit liman\nBucură-te, cel ce îndepărtezi săgetările celui viclean\nBucură-te, că mănăstirii tale îi ești bucurie roditoare\nBucură-te, cupă veșnic primitoare a Întreitului Soare\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 4-lea","p":["Risipind tulburarea și aducând încredințare, te-ai arătat cinstitei egumene și i-ai descoperit în chip limpede că sfintele oseminte pe care le găsise erau ale tale. Iar ea, văzându-te, s-a umplut de dumnezeiască insuflare și a cântat lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 4-lea","p":["Egumena, căreia i te-ai arătat, întru tot fericite, ți-a auzit glasul și te-a văzut că îi vorbeai, iar tu i-ai descoperit numele și chipul morții tale. Pentru aceasta, îți cântăm unele ca acestea:\nBucură-te, Mare Mucenice din ceata călugărilor\nBucură-te, cel proslăvit întru soborul sfinților\nBucură-te, căci ai viețuit în chipul îngeresc\nBucură-te, că te-ai învrednicit de rodul cel ceresc\nBucură-te, cunună aurită a sfintei tale mănăstiri\nBucură-te, pom pururea neveștejit, plin de sfintele rodiri\nBucură-te, că pe colina neprihăniților ai viețuit întru nevoință\nBucură-te, că dragostea de Dumnezeu ți-a fost armă și iscusință\nBucură-te, că ai sfărâmat puterea celui pizmaș și dușmănos\nBucură-te, că te-ai împodobit cu frumusețea Domnului Hristos\nBucură-te, că sufletele întinate de păcat le curățești\nBucură-te, că mulțimea credincioșilor o veselești\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 5-lea","p":["Prin uimitoare minuni și prin mulțimea arătărilor tale, tu descoperi tuturor, în vis ori în stare de trezie, slava pe care ai dobândit-o de la Dumnezeu, Sfinte Părinte Efrem. Pentru aceasta, privind cu bucurie către slava ta, strigăm Celui care te-a înveșmântat în lumină: Aliluia!"],"r":[]},{"h":"Icosul al 5-lea","p":["Racla cu sfintele tale moaște revarsă tămăduiri, bucurie și sănătate celor care vin să se închine în sfântă mănăstirea ta și-ți cer stăruitor ajutorul, Sfinte Părinte Efrem. De aceea, copleșiți fiind de darurile tale care se revarsă atât de bogat, strigăm către tine cu credință:\nBucură-te, cel care ne ești izvor de tămăduire\nBucură-te, că suferinzilor le ești neîncetată izbăvire\nBucură-te, că te arăți celor ce dorm, dar și celor ce veghează\nBucură-te, că vii degrabă la cei ce după ajutorul tău însetează\nBucură-te, că tainic îi sfințești pe cei ce cheamă numele tău\nBucură-te, veselia negrăită a celor ce văd slava chipului tău\nBucură-te, că tu tămăduiești de bolile ce nu au vindecare\nBucură-te, că ne ridici poverile ce le purtăm prin drăceasca insuflare\nBucură-te, că prin pronia de sus, multor credincioși te-ai arătat\nBucură-te, că îi umpli de bucurie pe cei care ți s-au rugat\nBucură-te, căci cortului ceresc îi ești locuitor\nBucură-te, preafierbinte și minunat ocrotitor\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 6-lea","p":["Cei care au dobândit facerile tale de bine s-au făcut solitori ai minunilor tale celor fără de număr și prin razele cuvintelor au întraripat sufletele tuturor credincioșilor. Pentru aceasta, Sfinte Părinte Efrem, mulțimile aleargă la sfântă mănăstirea ta și dobândesc har din belșug prin sfintele tale moaște, cântând Preasfântului Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 6-lea","p":["Strălucind ca un alt soare, te-ai arătat și ți-ai făcut auzit glasul pogorât din Cer, pe colina neprihăniților. Neștiut fiind de către pământeni, te-ai făcut cunoscut acum Bisericii lui Hristos, prin descoperirea sfintelor tale moaște, făcându-i pe toți oamenii să îți aducă dulce cântare:\nBucură-te, stâlp al pătimirilor mucenicești\nBucură-te, viță a dreptarelor dumnezeiești\nBucură-te, sfeșnic al luminii lui Hristos\nBucură-te, cel nou arătat nouă, celor de jos\nBucură-te, scară nou zidită a Bisericii Mântuitorului\nBucură-te, că nevoința virtuților ți-a zugrăvit chipul teoforului\nBucură-te, piatra cea din capul unghiului a luptelor mucenicești\nBucură-te, că tiranilor cugetului trupesc li te împotrivești\nBucură-te, că întru slava muceniciei ai suit calea cea cerească\nBucură-te, cel ce preamărești bunătatea dumnezeiască\nBucură-te, cel ce ți-ai vădit bărbăția sufletului\nBucură-te, tu, care abați turbarea vrăjmașului\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 7-lea","p":["În sânurile pământului ai rămas ascuns vreme de mai multe veacuri, purtătorule de Dumnezeu, iar în anii din urmă te-ai arătat prin bunăvoirea Domnului, ca o comoară sfântă, Părinte Efrem, îmbogățindu-i cu harul tău pe cei care-I strigă lui Hristos: Aliluia!"],"r":[]},{"h":"Icosul al 7-lea","p":["Te-ai arătat ca un nou astru în Biserica lui Hristos, luminând-o cu dumnezeieștile raze ale minunilor tale, iar pe cei care cer cu râvnă mijlocirea ta cea caldă îi izbăvești din asuprirea întunecatelor patimi. Pentru aceea, și noi, Sfinte Părinte Efrem, îți strigăm fără de încetare:\nBucură-te, ciorchine ce cu veselie ne-ndulcești\nBucură-te, căci amarele mâhniri tu risipești\nBucură-te, tămăduire minunată a celor aflați în grele pătimiri\nBucură-te, izbăvire a celor ce sunt împovărați de multe ispitiri\nBucură-te, că ești purtător de Dumnezeu și sfinților următor\nBucură-te, atlet preaiscusit și mucenic al Împăratului tuturor\nBucură-te, că nevoința cu lupta mucenicească ai împreunat\nBucură-te, cel ce slava cea de sus ne-ai arătat\nBucură-te, că întunericul patimilor tu îl risipești\nBucură-te, că în inima drepților bucurie zămislești\nBucură-te, că sângeroșilor păgâni le-ai biruit nebunia\nBucură-te, că fără de strămutare ți-ai purtat mucenicia\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 8-lea","p":["Harul pe care-l dăruiești, Preafericite Efrem, tuturor celor ce te cheamă în ajutor se revarsă asupra lor în chip preaminunat. Pentru aceasta, vestea minunilor tale s-a răspândit în toată Attica, iar noi, care alergăm cu grăbire la sfintele tale moaște, Îi strigăm lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 8-lea","p":["Întru totul luminat fiind de strălucirea dumnezeiască, nu te îndepărtezi nici o clipă de mănăstirea cea sfântă, Sfinte Mare Mucenice Efrem, arătându-te în felurite chipuri celor cu inima curată și dăruind har îmbelșugat celor ce cu râvnă îți cântă ție:\nBucură-te, slavă a călugăriei\nBucură-te, stâlp al Ortodoxiei\nBucură-te, curcubeu al luminii nezidite\nBucură-te, că ești părtaș al firii îndumnezeite\nBucură-te, alabastru plin cu mirul lacrimii de umilință\nBucură-te, surâs de bucurie izvorât din aspră nevoință\nBucură-te, jertfă sfințită prin război până la sânge\nBucură-te, că prin tine nebunia necredinței se înfrânge\nBucură-te, viață înveșmântată cu monahicească haină\nBucură-te, mireasmă bună a viețuirii fără de prihană\nBucură-te, stea care pe colina neprihăniților răsare\nBucură-te, că în bezna vremurilor noastre ești precum un soare\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 9-lea","p":["Tu dezlegi legăturile celor slăbănogi, îi tămăduiești pe cei îndrăciți și faci să înceteze mulțimea bolilor fără de leac. Pentru aceasta, atenienii, locuitorii din Pireu și din împrejurimi, se zoresc în număr mare spre mănăstirea ta, Părinte Efrem, lăudându-te pe tine și cântând Celui care te-a încununat: Aliluia!"],"r":[]},{"h":"Icosul al 9-lea","p":["O, preaminunate Părinte Efrem, când tânăra cea evlavioasă te-a văzut strălucind cu o slavă care nu era din lumea aceasta și a auzit dumnezeieștile tale cuvinte, a mărturisit tuturor grija pe care tu o porți mănăstirii tale. Pentru acestea toate, după cuviință îți cântăm:\nBucură-te, slava călugărilor din vremea de acum\nBucură-te, că spre Cer suit-ai pe mucenicescul drum\nBucură-te, că ocrotitor neobosit al mănăstirii tale ești\nBucură-te, căci cu Sfinții Îngeri dimpreună locuiești\nBucură-te, că i-ai tămăduit pe cei cuprinși de noianul durerii\nBucură-te, că pe paralitic tu l-ai ridicat prin harul înfierii\nBucură-te, căci cu darul tău ai risipit groaznice dureri de cap\nBucură-te, că boala diabetului tot prin darul tău a încetat\nBucură-te, potir ceresc ce te pogori în revărsări de har\nBucură-te, nestemată dată firii omenești în dar\nBucură-te, Mare Mucenice, podoaba nevoitorilor\nBucură-te, icoană preaslăvită a cetei călugărilor\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 10-lea","p":["Cuvioasele monahii te-au văzut în dumnezeiască vedenie ori în vis, preumblându-te prin locașul tău, Sfinte Părinte Efrem, și umplându-se ele de o mare bucurie, te-au ales drept sfântul lor ocrotitor. Pentru unele ca aceste daruri, dintru smerenia inimii strigă către Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 10-lea","p":["Adunând în sufletul tău mirul cel de taină dobândit întru adâncul smereniei, dăruiești mângâiere inimilor celor credincioși, iar din racla cu sfintele tale moaște răspândești minunată mireasmă tuturor celor care, cu capetele plecate, îți cântă cu evlavie:\nBucură-te, mir al smereniei preabinemirositor\nBucură-te, că turmei tale îi ești dumnezeiesc păstor\nBucură-te, Rai ce răspândește ale nestricăciunii bune-nmiresmări\nBucură-te, chiparos înalt al sfintei nepătimiri\nBucură-te, că pe potrivnicul cu răstignirea ta l-ai biruit\nBucură-te, că prin chinurile mucenicești Hristos te-a proslăvit\nBucură-te, că moaștele tale în tainița pământului s-au aflat\nBucură-te, că din dumnezeiască poruncă tu te-ai arătat\nBucură-te, că întinăciunea sufletelor noastre tu o curățești\nBucură-te, că răutatea credincioșilor degrabă o pârjolești\nBucură-te, că tu în toată vremea dăruiești tămăduire\nBucură-te, că ne ocrotești fără de contenire\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 11-lea","p":["Noroadele credincioșilor de pretutindeni L-au lăudat pe Domnul când au fost aflate sfintele tale moaște, căci El, prin dumnezeiasca Sa iconomie, le-a ținut tăinuite în pământ și nestricate de curgerea atâtor ani. Pe acestea cinstindu-le, Sfinte Efrem, și noi ne închinăm înaintea Împăratului Vieții, zicând: Aliluia!"],"r":[]},{"h":"Icosul al 11-lea","p":["Prin mijlocirea ta la tronul Mântuitorului Hristos, păzești mănăstirea de toată nevoia și necazul, dăruindu-i binecuvântarea ta, Părinte Efrem, căci iat-o alergând spre dobândirea darului tău și strigând cu umilință către tine:\nBucură-te, zidul nostru nesurpat\nBucură-te, al credincioșilor turn nestrămutat\nBucură-te, păzitorul de nădejde al mănăstirii tale\nBucură-te, căci pe copii îi ții sub ocrotirea trezviei tale\nBucură-te, sprijin nebiruit al monahiilor celor cu sârguință\nBucură-te, tainică slavă a maicilor iubitoare de nevoință\nBucură-te, cel ce cererile credincioșilor plinești\nBucură-te, că rugămințile copiilor tăi le primești\nBucură-te, că ne dăruiești toate bunătățile\nBucură-te, că alungi de la noi toate răutățile\nBucură-te, că pentru lumea întreagă te rogi neîncetat\nBucură-te, că prin tine mângâiere mare am aflat\nBucură-te, Sfinte Părinte Efrem, de-a pururi fericite!"],"r":[]},{"h":"Condacul al 12-lea","p":["Din destul reverși daruri și belșug de veselie și de fericire dumnezeiască, Părinte Efrem, iar racla cu sfintele tale moaște veselește sufletele noastre și ne sfințește chiar și trupurile, nouă, celor sărmani, ce îndrăznim să grăim Preasfintei T /* Rânduiala: o săptămână de bază, următoarea schimbată.
   Ancoră: luni 24 august 2026 = săptămână de bază. */
const ANCORA = Date.UTC(2026, 7, 24);
const RANDUIALA = {
  1: ["mihail-gavriil", "ioachim-ana"],
  3: ["ioan-rusul",     "stelian"],
  5: ["buna-vestire",   "efrem"]
};
const PERSOANE = {
  dana: {nume:"Daniela",   clasa:"card--dana", serie:0},
  alex: {nume:"Alexandru", clasa:"card--alex", serie:1}
};
const ZILE = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const ZILE_MARI = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const LUNI = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie",
              "august","septembrie","octombrie","noiembrie","decembrie"];

const gasesteAcatist = s => ACATISTE.find(a => a.slug === s);
const cheieZi = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

function luniaSaptamanii(d){
  const zi = (d.getDay() + 6) % 7;
  return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate() - zi);
}
function schimbat(d){
  const n = Math.round((luniaSaptamanii(d) - ANCORA) / 604800000);
  return ((n % 2) + 2) % 2 === 1;
}
function dataZilei(zi, azi){
  const delta = (zi - azi.getDay() + 7) % 7;
  return new Date(azi.getFullYear(), azi.getMonth(), azi.getDate() + delta);
}
function acatistPentru(persoana, data){
  const pereche = RANDUIALA[data.getDay()];
  if (!pereche) return null;
  const s = PERSOANE[persoana].serie;
  return gasesteAcatist(pereche[schimbat(data) ? 1 - s : s]);
}

const ls = {
  get(k, def){ try { const v = localStorage.getItem(k); return v === null ? def : v; } catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let scala = parseFloat(ls.get("scala", "1")) || 1;
const aplicaScala = () => document.documentElement.style.setProperty("--scale", scala.toFixed(2));
aplicaScala();

function el(tag, cls, text){
  const n = document.createElement(tag || "div");
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/* textul devine un șir continuu de bucăți; paginile se taie după cât încape pe ecran */
function bucati(acatist){
  const surse = INCEPUT.concat(acatist.sections);
  const out = [];
  let b = 0;
  for (const s of surse) {
    if (s.h) out.push({k:"h", t:s.h, b:b++});
    for (const t of s.p) {
      const bloc = b++;
      if (t.indexOf("\n") >= 0) {
        const linii = t.split("\n").filter(Boolean);
        linii.forEach((l, ix) => {
          const ultim = ix === linii.length - 1;
          for (const f of (ix === 0 ? fraze(l) : [l])) out.push({k:"l", t:f, b:bloc, ix, ultim});
        });
      } else {
        for (const f of fraze(t)) out.push({k:"p", t:f, b:bloc});
      }
    }
    for (const r of (s.r || [])) out.push({k:"r", t:r, b:b++});
  }
  return out;
}
/* Taie paragraful în bucăți mici, la capăt de frază sau la punct și virgulă.
   Bucățile ajunse pe aceeași pagină se lipesc la loc, deci textul arată neschimbat;
   rostul lor e doar ca pagina să se poată umple până jos. */
function fraze(t){
  const out = [];
  for (const f of taie(t, /[.!?;:]\s+/g, 100, 40, true)) {
    if (f.length > 170) out.push.apply(out, taie(f, /,\s+/g, 170, 55, false));
    else out.push(f);
  }
  return out;
}
function taie(t, re, prag, minim, capat){
  if (t.length <= prag) return [t];
  const out = [];
  let start = 0, m;
  re.lastIndex = 0;
  while ((m = re.exec(t))) {
    if (capat && ".!?".indexOf(m[0][0]) >= 0 && !/[A-ZĂÂÎȘȚ„]/.test(t.charAt(m.index + m[0].length))) continue;
    if (m.index + 1 - start < minim) continue;
    out.push(t.slice(start, m.index + 1));
    start = m.index + m[0].length;
  }
  const rest = t.slice(start);
  if (rest.trim()) out.push(rest);
  return out.length ? out : [t];
}

function randeaza(cont, de, pana){
  cont.textContent = "";
  let k = de;
  while (k < pana) {
    const it = itemi[k];
    if (it.k === "h")      { cont.append(el("h2","h", it.t)); k++; }
    else if (it.k === "r") { cont.append(el("div","rubric", it.t)); k++; }
    else if (it.k === "p") {
      const bloc = it.b, parti = [];
      while (k < pana && itemi[k].k === "p" && itemi[k].b === bloc) { parti.push(itemi[k].t); k++; }
      cont.append(el("p","t", parti.join(" ")));
    }
    else {
      const bloc = it.b, v = el("div","verse");
      while (k < pana && itemi[k].k === "l" && itemi[k].b === bloc) {
        const ix = itemi[k].ix, parti = [];
        let ultim = false;
        while (k < pana && itemi[k].k === "l" && itemi[k].b === bloc && itemi[k].ix === ix) {
          parti.push(itemi[k].t); ultim = itemi[k].ultim; k++;
        }
        const n = el("span","ln", parti.join(" "));
        if (ix === 0) n.classList.add("lead");
        if (ultim && /^bucur[ăa]-te/i.test(parti[0])) n.classList.add("refren");
        v.append(n);
      }
      cont.append(v);
    }
  }
  if (cont.firstElementChild) cont.firstElementChild.classList.add("first");
}

function inaltimeDisponibila(){
  const cs = getComputedStyle(scroll);
  const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const cap = topline.offsetHeight + parseFloat(getComputedStyle(topline).marginBottom);
  return scroll.clientHeight - pad - cap - 4;
}

function pagineaza(){
  const masura = el("div","pg meas");
  sheet.append(masura);
  const spatiu = inaltimeDisponibila();
  pagini = [];
  let start = 0;
  while (start < itemi.length) {
    let sfarsit = start;
    while (sfarsit < itemi.length) {
      randeaza(masura, start, sfarsit + 1);
      if (masura.scrollHeight > spatiu && sfarsit > start) break;
      sfarsit++;
      if (masura.scrollHeight > spatiu) break;   // o singură bucată mai înaltă decât ecranul
    }
    while (sfarsit - start > 1 && itemi[sfarsit - 1].k === "h") sfarsit--;  // fără titlu orfan jos
    pagini.push([start, sfarsit]);
    start = sfarsit;
  }
  masura.remove();
}

function paginaCu(item){
  for (let n = 0; n < pagini.length; n++) if (item < pagini[n][1]) return n;
  return Math.max(0, pagini.length - 1);
}

  inapoi.onclick = acasa;
  topline.append(inapoi, el("div","cine", PERSOANE[persoana].nume + " · " + acatist.short));
  home.classList.add("off");
  reader.classList.add("on");
  pagineaza();
  i = paginaCu(ancora);
  arata();
  tineEcranulAprins();
  if (document.fonts && document.fonts.status !== "loaded") document.fonts.ready.then(repagineaza);
}
function acasa(){
  reader.classList.remove("on");
  home.classList.remove("off");
  if (blocare) { blocare.release().catch(()=>{}); blocare = null; }
  randeazaAcasa();
}
function arata(){
  randeaza(pgEl, pagini[i][0], pagini[i][1]);
  pgEl.style.animation = "none"; void pgEl.offsetWidth; pgEl.style.animation = "";
  count.textContent = (i + 1) + " / " + pagini.length;
  bPrev.disabled = i === 0;
  bNext.disabled = i === pagini.length - 1;
  scroll.scrollTop = 0;
  ls.set(cheiePozitie, String(pagini[i][0]));
}
function repagineaza(){
  if (!reader.classList.contains("on") || !itemi.length) return;
  const ancora = pagini.length ? pagini[i][0] : 0;
  pagineaza();
  i = paginaCu(ancora);
  arata();
}
function du(d){
  const n = i + d;
  if (n < 0 || n >= pagini.length) return;
  i = n; arata();
}
bPrev.onclick = () => du(-1);
bNext.onclick = () => du(+1);

addEventListener("keydown", e => {
  if (!reader.classList.contains("on")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); du(+1); }
  if (e.key === "ArrowLeft"  || e.key === "PageUp") { e.preventDefault(); du(-1); }
  if (e.key === "Escape") acasa();
});

let tx = 0, ty = 0;
scroll.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
scroll.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) du(dx < 0 ? +1 : -1);
}, {passive:true});

let ceas = null;
addEventListener("resize", () => { clearTimeout(ceas); ceas = setTimeout(repagineaza, 180); });
if (window.visualViewport) visualViewport.addEventListener("resize", () => { clearTimeout(ceas); ceas = setTimeout(repagineaza, 180); });

async function tineEcranulAprins(){
  try { if ("wakeLock" in navigator) blocare = await navigator.wakeLock.request("screen"); } catch(e){}
}
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && reader.classList.contains("on") && !blocare) tineEcranulAprins();
});

randeazaAcasa();
</script>
