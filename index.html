<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rânduiala acatistelor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@400;500;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&display=swap">

<style>
:root{
  --ground:#F0EEF3;
  --surface:#FBFAFC;
  --ink:#231F2B;
  --ink-soft:#4A4356;
  --muted:#7A7288;
  --rule:#DEDAE6;
  --gold:#8A6D2A;
  --dana:#7B3A4A;
  --dana-ink:#FBF6F7;
  --alex:#31465C;
  --alex-ink:#F4F7FA;
  --shadow:0 1px 2px rgba(35,31,43,.06), 0 8px 24px -12px rgba(35,31,43,.18);
  --scale:1;
  --serif:"Gentium Book Plus", Cambria, "Palatino Linotype", Georgia, serif;
  --caps:"Alegreya SC", "Gentium Book Plus", Georgia, serif;
  --ui:ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141219;
    --surface:#1C1922;
    --ink:#E9E4EE;
    --ink-soft:#C3BCCE;
    --muted:#948CA3;
    --rule:#332E3D;
    --gold:#C6A155;
    --dana:#7A3948;
    --dana-ink:#FBF1F3;
    --alex:#2F4256;
    --alex-ink:#EFF4F8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#141219;
  --surface:#1C1922;
  --ink:#E9E4EE;
  --ink-soft:#C3BCCE;
  --muted:#948CA3;
  --rule:#332E3D;
  --gold:#C6A155;
  --dana:#7A3948;
  --dana-ink:#FBF1F3;
  --alex:#2F4256;
  --alex-ink:#EFF4F8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--serif);
  font-size:calc(clamp(1.05rem, .96rem + .68vw, 1.3rem) * var(--scale));
  line-height:1.58;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

/* ---------- acasă ---------- */
#home{
  min-height:100dvh;
  display:flex;flex-direction:column;
  gap:clamp(1.2rem,3.5vh,2.2rem);
  padding:max(1.4rem,env(safe-area-inset-top)) 1.2rem max(1.4rem,env(safe-area-inset-bottom));
  max-width:60rem;margin:0 auto;
  justify-content:center;
}
.datebar{text-align:center;display:flex;flex-direction:column;gap:.15rem}
.datebar .zi{
  font-family:var(--caps);font-weight:500;
  font-size:1.5em;letter-spacing:.02em;line-height:1.15;
}
.datebar .sub{font-family:var(--ui);font-size:.72em;color:var(--muted);letter-spacing:.02em}
.datebar .rota{
  font-family:var(--caps);font-size:.7em;letter-spacing:.14em;text-transform:uppercase;
  color:var(--gold);margin-top:.35rem;
}

.cards{display:grid;gap:.9rem;grid-template-columns:1fr}
@media (min-width:44rem){.cards{grid-template-columns:1fr 1fr;gap:1.1rem}}

.card{
  display:flex;flex-direction:column;gap:.5rem;
  text-align:left;
  padding:clamp(1.1rem,3.2vh,1.7rem) clamp(1.1rem,3vw,1.6rem);
  border-radius:14px;color:var(--dana-ink);
  min-height:clamp(7.5rem,20vh,11rem);
  justify-content:space-between;
  box-shadow:var(--shadow);
  transition:transform .16s ease, filter .16s ease;
}
.card:active{transform:scale(.985);filter:brightness(1.06)}
.card--dana{background:var(--dana)}
.card--alex{background:var(--alex);color:var(--alex-ink)}
.card .nume{
  font-family:var(--caps);font-weight:700;
  font-size:1.7em;line-height:1;letter-spacing:.03em;
}
.card .cand{
  font-family:var(--ui);font-size:.66em;letter-spacing:.16em;text-transform:uppercase;
  opacity:.72;
}
.card .titlu{font-size:.92em;line-height:1.35;opacity:.94;text-wrap:balance}

.zile{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap}
.zile button{
  font-family:var(--caps);font-size:.78em;letter-spacing:.06em;
  padding:.45rem 1rem;border-radius:999px;
  color:var(--muted);border:1px solid var(--rule);
}
.zile button[aria-pressed="true"]{color:var(--surface);background:var(--ink-soft);border-color:var(--ink-soft)}

.prefs{
  display:flex;align-items:center;justify-content:center;gap:.55rem;
  font-family:var(--ui);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
}
.prefs button{
  border:1px solid var(--rule);border-radius:8px;
  width:2.4rem;height:2.1rem;line-height:1;
  font-family:var(--serif);color:var(--ink-soft);
  display:grid;place-items:center;
}
.sursa{font-family:var(--ui);font-size:.62em;color:var(--muted);text-align:center;letter-spacing:.02em}
.sursa a{color:inherit}

/* ---------- citire ---------- */
#reader{display:none;height:100dvh;flex-direction:column}
#reader.on{display:flex}
#home.off{display:none}

#scroll{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:max(.9rem,env(safe-area-inset-top)) 1.15rem 1rem;
}
.sheet{max-width:37rem;margin:0 auto;position:relative}

.topline{
  display:flex;align-items:baseline;gap:.7rem;justify-content:space-between;
  font-family:var(--ui);font-size:.66em;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:clamp(1.1rem,3.5vh,1.9rem);
}
.topline button{color:var(--muted);letter-spacing:.08em;white-space:nowrap}
.topline .cine{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pg{animation:in .2s ease both}
.meas{
  position:absolute;left:0;right:0;top:0;
  visibility:hidden;pointer-events:none;animation:none;
}
@keyframes in{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pg{animation:none}.card{transition:none}}

.h{
  font-family:var(--caps);font-weight:500;
  font-size:1.02em;line-height:1.25;letter-spacing:.06em;
  text-align:center;text-wrap:balance;
  color:var(--gold);
  margin:1.75em 0 .7em;
}
p.t{margin:0 0 1.05em}
.verse{margin:0 0 1.05em}
.verse .ln{display:block;padding-left:1.35em;text-indent:-1.35em}
.verse .ln.lead{padding-left:0;text-indent:0;margin-bottom:.12em}
.verse .ln.refren{margin-top:.12em;color:var(--gold);font-style:italic}
.rubric{
  font-style:italic;text-align:center;color:var(--muted);
  font-size:.88em;margin:1.4em 0 1.05em;
}
.first{margin-top:0}
.pg > :last-child{margin-bottom:0}
.end{
  margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);
  font-family:var(--ui);font-size:.64em;letter-spacing:.04em;color:var(--muted);text-align:center;
}
.end a{color:inherit}

/* bara de jos */
#bar{
  display:grid;grid-template-columns:1fr 5.2rem 1fr;
  gap:.5rem;align-items:stretch;
  padding:.5rem .6rem calc(.5rem + env(safe-area-inset-bottom));
  border-top:1px solid var(--rule);
  background:var(--surface);
}
#bar button{
  border-radius:12px;background:var(--ground);
  display:grid;place-items:center;
  min-height:clamp(3.2rem,8.5vh,4.4rem);
  color:var(--ink-soft);
  border:1px solid var(--rule);
  transition:transform .12s ease, background .12s ease;
}
#bar button:active{transform:scale(.97);background:var(--rule)}
#bar button[disabled]{opacity:.3;pointer-events:none}
#bar button span{font-size:1.9em;line-height:1;display:block}
#count{
  display:grid;place-items:center;text-align:center;
  font-family:var(--ui);font-size:.7em;color:var(--muted);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
}
@media (min-width:44rem){
  #bar{grid-template-columns:1fr 7rem 1fr;padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom))}
  #bar button span{font-size:2.2em}
}
</style>

<main id="home"></main>

<section id="reader" aria-label="Citire">
  <div id="scroll">
    <div class="sheet" id="sheet">
      <div class="topline" id="topline"></div>
      <div class="pg" id="pg"></div>
    </div>
  </div>
  <nav id="bar">
    <button id="prev" aria-label="Pagina anterioară"><span>‹</span></button>
    <div id="count"></div>
    <button id="next" aria-label="Pagina următoare"><span>›</span></button>
  </nav>
</section>

<script>
const ACATISTE = [{"slug":"mihail-gavriil","title":"Acatistul Sfinților Arhangheli Mihail și Gavriil","short":"Sf. Arhangheli Mihail și Gavriil","source":"https://doxologia.ro/acatistul-sfintilor-arhangheli-mihail-gavriil","sections":[{"h":"Condac 1","p":["Pe căpeteniile îngerilor Treimii, pe Mihail și Gavriil, să-i lăudăm noi toți, iubitorii de praznic, care ne acoperim cu aripile amândurora și din nevoile cele de multe feluri ne izbăvim, unuia grăind: bucură-te, slujitorule al Legii, iar altuia zicând: bucură-te, îngere al darului!"],"r":[]},{"h":"Icos 1","p":["Arhanghele Mihaile, mai-marele cetelor îngerilor celor fără de trup, creat ai fost de Dumnezeu, Ziditorul tuturor; de aceea, cu bucurie, laude de acest fel aducem ție:\nBucură-te, făptură a Minții celei ce a făcut lumea;\nBucură-te, revărsarea luminii celei mai înainte de lumină;\nBucură-te, cel ca focul, care stai aproape de Dumnezeire;\nBucură-te, slujitorule neostenit al Treimii;\nBucură-te, Duh înfocat și nematerial după asemănarea lui Dumnezeu;\nBucură-te, ființă nemuritoare, lăudătoare de Dumnezeu;\nBucură-te, apărătorule de foc al cerului;\nBucură-te, căpetenia oștii celei nematerialnice;\nBucură-te, luminătorule al cetelor celor bine mulțumitoare;\nBucură-te, arzătorule al duhului celui nemulțumitor;\nBucură-te, prin care firea îngerilor s-a întărit;\nBucură-te, prin care satana s-a surpat;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 2","p":["Pe îngerii cei nemulțumitori văzându-i trufindu-se și din cerul cel înfocat căzând, o dumnezeiescule Mihaile, ca un rob mulțumitor stând, ai strigat: «Să stăm bine și să luăm aminte», cântând Sfintei Treimi: Aliluia!"],"r":[]},{"h":"Icos 2","p":["Gavriil, al minților celor ascunse și al tainelor Celui Preaînalt părtaș te-ai arătat, făcând mai înainte cunoscute cele ce aveau să fie și bunele vestiri de bucurie oamenilor spunându-le. Pentru aceasta, cu dorință mă grăbesc a-ți cânta ție:\nBucură-te, văzătorule al luminii celei necunoscute;\nBucură-te, părtașule al tainelor lui Dumnezeu;\nBucură-te, cel ce descoperi cele ascunse ale voinței;\nBucură-te, vestitorule de cele negrăite ale lui Dumnezeu;\nBucură-te, că strălucești cu mintea în știința cea ascunsă;\nBucură-te, că întru această știință înveți pe față pe oameni;\nBucură-te, slujitorule al bunelor vestiri dumnezeiești;\nBucură-te, vestitorul lucrurilor celor îmbucurătoare;\nBucură-te, arătarea multor neștiințe;\nBucură-te, că mai înainte ai cunoscut cele ce aveau să fie;\nBucură-te, prin care în lume s-a adus bucuria;\nBucură-te, prin care întristarea a fost îndepărtată afară;\nBucură-te, Gavriile, îngere al darului!"],"r":[]},{"h":"Condac 3","p":["Proorocului Daniel mai mult decât tuturor proorocilor ai arătat taina cea străină a venirii celei înfricoșătoare a lui Hristos și a iconomiei, preamare Gavriile; și pe el l-ai înțelepțit a cânta cu bucurie lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icos 3","p":["Având numirea de putere de la Dumnezeu, Mihaile, cu dumnezeiască minte puternic în războaie pururea te-ai arătat; și pe Iacov în luptă l-ai întărit ca să biruiască neamurile străine; pentru aceea mărim puterea ta, zicând:\nBucură-te, cel ce ești mai puternic decât focul;\nBucură-te, cel ce ești mai ascuțit decât văpaia;\nBucură-te, cel ce ai înecat oștile egiptenilor;\nBucură-te, cel ce ai învins cetele canaanenilor;\nBucură-te, că pe Moise și Aaron i-ai întărit;\nBucură-te, că pe Iisus al lui Navi îndrăzneț l-ai făcut;\nBucură-te, cel ce deodată oștirea asirienilor ai tăiat;\nBucură-te, cel ce pe Simion al amoreilor l-ai lovit;\nBucură-te, pierzarea lui Og, împăratul Vasanului;\nBucură-te, pază a marelui Moise;\nBucură-te, prin care se pierd cei rău-credincioși;\nBucură-te, prin care dreptcredincioșii se înalță;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 4","p":["Mihaile, căpetenie a îngerilor, roagă, cu solirile tale, pe Dumnezeu pentru noi care prealăudatul tău praznic cu dragoste îl cinstim, ca zilele noastre în fapte bune să le petrecem și ne învrednicește ca, viața cea mai bună dobândind, lui Dumnezeu împreună cu tine să-I cântăm: Aliluia!"],"r":[]},{"h":"Icos 4","p":["Venit-ai de la Cel Preaînalt, Gavriile, minte dumnezeiască, aducând Anei și lui Ioachim bunele vestiri de bucurie, cu dezlegarea sterpăciunii lor; pentru care, bucurându-ne, ție cu credință îți grăim:\nBucură-te, aducătorule al știrilor frumoase;\nBucură-te, cel care celor doritoare de prunci le aduci bucurie;\nBucură-te, cel ce ești rodire dată de Dumnezeu celor neroditori;\nBucură-te, naștere plăcută lui Dumnezeu, a celor fără de copii;\nBucură-te, că fericitului strămoș i-ai adus naștere mărită;\nBucură-te, că fericitei strămoașe i-ai dat odraslă pântecelui;\nBucură-te, cel ce dezlegi legăturile nașterii de prunci;\nBucură-te, cel care povățuiești darul celor ce se nasc;\nBucură-te, laudă a multor părinți;\nBucură-te, mângâierea maicilor celor bune;\nBucură-te, prin care crește neamul omenesc;\nBucură-te, prin care nașterea mai înainte se vestește;\nBucură-te, Gavriile, îngere al darului!"],"r":[]},{"h":"Condac 5","p":["Maria, Născătoarea de Dumnezeu și Doamna lumii venind în biserica Domnului, trimis ai fost, o, Gavriile, să-i aduci cu îngrijire hrană cerească și totdeauna ai deșteptat-o spre a cânta lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icos 5","p":["Pe strămoșii cei de demult, care se rugau lui Dumnezeu, i-ai mântuit din multe rele, o, Mihaile, iar poporului ales pururea i-ai fost înaintemergător; de aceea, într-acest fel grăim ție:\nBucură-te, cel ce pe Isaac de junghiere l-ai scăpat;\nBucură-te, cel ce pe Avraam de bucurie l-ai umplut;\nBucură-te, cel ce pe însetatul Ismail l-ai răcorit;\nBucură-te, străină mângâiere a Agarei celei ce plângea;\nBucură-te, stâlpul cel în chip de foc care pe Israel l-ai condus;\nBucură-te, norul cel aurit, care pe Israel în cale îl acopereai;\nBucură-te, că pe cei întâi-născuți ai evreilor i-ai păzit;\nBucură-te, că pe cei întâi-născuți ai egiptenilor i-ai omorât;\nBucură-te, laudă strălucită a evreilor;\nBucură-te, îngrădire tare a Legii;\nBucură-te, că pe popor din Egipt ai scos;\nBucură-te, că pe el la pământ bun l-ai adus;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 6","p":["Când S-a pogorât în muntele Sinai Marele Dumnezeu, vrând să dea Lege evreilor, prin slujirea și mijlocirea ta, mare Mihaile, pe aceasta lui Moise o ai descoperit și l-ai învățat să cânte: Aliluia!"],"r":[]},{"h":"Icos 6","p":["Lui Zaharia celui sfințit care, odinioară, în locașul lui Dumnezeu, cerea scăpare și mântuire pentru popor, i-ai vestit, o, Gavriile, nașterea dumnezeiescului Înaintemergător. De aceea, de bunele tale vestiri spăimântându-ne, grăim ție acestea:\nBucură-te, cel ce ai vestit omenirii lucruri preaminunate;\nBucură-te, cel ce pe îngerul Tatălui l-ai arătat;\nBucură-te, grăire îmbucurătoare către Zaharia;\nBucură-te, dulce auzire pentru Elisabeta;\nBucură-te, că pe Botezătorul lui Hristos l-ai binevestit;\nBucură-te, că pe el, al doilea Ilie, mai înainte l-ai vestit;\nBucură-te, cel ce ai prevestit pe predicatorul pocăinței;\nBucură-te, trâmbița cea tare răsunătoare a candelabrului luminii;\nBucură-te, vestitorul începerii Darului;\nBucură-te, vestirea zorilor zilei;\nBucură-te, semnul mântuirii oamenilor;\nBucură-te, temelia împărăției cerurilor;\nBucură-te, Gavriile, îngere al darului!"],"r":[]},{"h":"Condac 7","p":["Dumnezeu Cuvântul, vrând mai înainte a Se întrupa pentru noi, taina aceasta numai ție, o, Gavriile, a încredințat-o și slujitor al acesteia te-a ales pe tine; iar tu, cugetând în sineți la minunea aceasta, cântai așa: Aliluia!"],"r":[]},{"h":"Icos 7","p":["Pe cei trei tineri de demult, din văpaia cuptorului i-ai scăpat, Mihaile arhanghele, arătându-te preamărit și luminat cu chipul și asemănarea lui Dumnezeu, încât de minunea aceasta tiranul s-a înspăimântat; de aceea grăim ție:\nBucură-te, stingerea focului celui nepotolit;\nBucură-te, ațâțarea văpăii celei pururea vii;\nBucură-te, scăparea tinerilor feciori;\nBucură-te, păzire a trupurilor celor neîntinate;\nBucură-te, că tu, cu înfățișarea ta, pe tiranul ai înfricoșat foarte;\nBucură-te, că tu pe Daniel proorocul l-ai împuternicit;\nBucură-te, cel ce ai răpit pe Avacum proorocul;\nBucură-te, că pe el în grabă l-ai dus la Babilon;\nBucură-te, învingerea cea tare a lui Ghedeon;\nBucură-te, înfrângerea cea strălucită a lui Madiam;\nBucură-te, prin care se întăresc credincioșii;\nBucură-te, prin care se înfricoșează tiranii;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 8","p":["Străină minune, văzându-te pe tine Balaam vrăjitorul, și în urmă, David proorocul, la tine, o, fericite Mihaile, în grabă căzând, s-au închinat: unul de frică încremenind, iar celălalt lui Dumnezeu grăind: Aliluia!"],"r":[]},{"h":"Icos 8","p":["Ca un purtător de fulger atotstrălucit și atotvoios ai venit către cea plină de dar, Gavriile, aducându-i bunele vestiri de bucurie. Pentru aceasta și noi, bucurându-ne, te fericim pe tine, cântându-ți:\nBucură-te, vestitorule al bucuriei celei nesfârșite;\nBucură-te, dezlegătorule al blestemului celui de demult;\nBucură-te, ridicarea lui Adam celui căzut;\nBucură-te, mângâierea Evei celei întristate;\nBucură-te, înalt descoperitorule al întrupării Cuvântului;\nBucură-te, mărite cunoscător al pogorârii lui Dumnezeu;\nBucură-te, cel ce bucurându-te ai zis celei pline de dar: «Bucură-te»;\nBucură-te, cel ce ai dezlegat cu «Bucură-te» toată întristarea;\nBucură-te, stea care ai vestit Soarele;\nBucură-te, luminătorule, care ne-ai arătat lumina cea neapropiată;\nBucură-te, prin care lumea s-a luminat;\nBucură-te, prin care întunericul s-a desființat;\nBucură-te, Gavriile, îngere al darului!"],"r":[]},{"h":"Condac 9","p":["Nașterea Mântuitorului o ai vestit cu bucurie păstorilor celor ce privegheau, Gavriile, bucurându-te; și la închinarea Lui pe magi, ca o stea luminoasă, i-ai condus și pe toți i-ai înțelepțit a cânta Celui născut așa: Aliluia!"],"r":[]},{"h":"Icos 9","p":["Râvnitor și puternic apărător al Tesalonicului celui nou te-ai arătat, Mihaile, purtătorule de lumină și ajutător mare ești pururea popoarelor creștine, de multe nevoi scăpându-le și îndemnându-le a cânta ție:\nBucură-te, cetatea poporului celui nou;\nBucură-te, tăria neamurilor creștine;\nBucură-te, cel ce pe apostoli de multe ori i-ai întărit;\nBucură-te, cel ce pe martiri tari i-ai făcut;\nBucură-te, că pe Petru din legături și din închisoare l-ai slobozit;\nBucură-te, că tu pe Irod îndată l-ai omorât;\nBucură-te, al Bisericii păzitor neînvins;\nBucură-te, cel ce ești asupra ereticilor secure cu două ascuțișuri;\nBucură-te, întărire puternică a cuvioșilor;\nBucură-te, sprijin luminat al ierarhilor;\nBucură-te, prin care se lățește credința;\nBucură-te, prin care se micșorează rătăcirea;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 10","p":["Sfârșitul a toată lumea când se va face, Mihaile, trâmbița cea mai de pe urmă vei trâmbița, după care morții din pământ, sculându-se, cu frică vor sta înaintea judecătorului nepărtinitor, cântând împreună cu tine cântarea: Aliluia!"],"r":[]},{"h":"Icos 10","p":["Totdeauna numele tău, o, Gavriile, purtătorule de lumină, arată luminat înălțimea rânduielii tale, căci, după chemarea lui Dumnezeu, te-ai arătat cu cuviință slujitor vrednic al Cuvântului, Dumnezeu-Omului; de aceea, cu laude te fericim, grăind:\nBucură-te, prin care logodnicul în taină s-a învățat;\nBucură-te, prin care Fecioara de dânsul a fost luată;\nBucură-te, cel ce numele lui Iisus mai înainte l-ai spus;\nBucură-te, cel ce ai vestit mântuirea lumii;\nBucură-te, că logodnicului Iosif i-ai descoperit taina;\nBucură-te, că pe Iisus în Egipt L-ai scăpat;\nBucură-te, cel ce pe Hristos din Egipt înapoi L-ai chemat;\nBucură-te, cel ce ai vestit că El va locui în cetatea Nazaret;\nBucură-te, cel ce pe credincioșii magi, taina i-ai învățat;\nBucură-te, că pe dânșii de Irod i-ai scăpat;\nBucură-te, prin care Iisus a fost păzit;\nBucură-te, prin care Irod a fost luat în râs;\nBucură-te, Gavriile, îngere al darului!"],"r":[]},{"h":"Condac 11","p":["Deasupra pietrei mormântului celui primitor de Viață, șezând îmbrăcat în alb și ca fulgerul strălucind, Gavriile, învierea lui Hristos ai binevestit femeilor, zicând lor «nu plângeți» și cântând cântarea: Aliluia!"],"r":[]},{"h":"Icos 11","p":["Făclie lumii ești, Mihaile arhanghele, strălucind mințile credincioșilor și povățuindu-le către cunoștința cea dumnezeiască și către mântuire, luminând și mântuind de răutățile amăgitoare pe toți care grăiesc:\nBucură-te, apărătorule al tuturor credincioșilor;\nBucură-te, făcătorule al multor feluri de minuni;\nBucură-te, neîmpuținată tămăduire a bolnavilor;\nBucură-te, grabnică scăpare a celor din robie;\nBucură-te, cel ce ai apărat Mănăstirea Dochiarului;\nBucură-te, că pe aceasta o ai izbăvit de năvălirea saracinilor;\nBucură-te, scăparea tânărului celui afundat;\nBucură-te, arătarea aurului celui ascuns;\nBucură-te, cel ce ai făcut să izvorască izvor de aghiasmă;\nBucură-te, cel ce pe apă faci minuni;\nBucură-te, înfrumusețătorul Bisericii creștine;\nBucură-te, ajutătorul Bisericii acesteia;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 12","p":["Dar dumnezeiesc dăruiește celor ce serbează cu dragoste ziua amintirii tale, Mihaile, și celor ce te cheamă pe tine la ieșirea lor din viață arată-te ajutător și mai ales păzește-ne pe noi, cei ce în biserica ta cântăm: Aliluia!"],"r":[]},{"h":"Icos 12","p":["De la tine, o, îngere al darului, învățându-ne a cânta în psalmi laude de bucurie dumnezeieștii întrupări, ție cele de mulțumire cu dor cântăm și ca unui bun vestitor, mărindu-te, așa-ți grăim:\nBucură-te, bucuria celor întristați;\nBucură-te, păzitorul celor asupriți;\nBucură-te, bogăția nefurată a săracilor;\nBucură-te, liman de mântuire al celor ce înoată;\nBucură-te, armă prea puternică a credincioșilor;\nBucură-te, laudă preamărită a preoților evlavioși;\nBucură-te, întăritorule al mănăstirilor;\nBucură-te, îngrijitorule minunat al bisericii acesteia;\nBucură-te, apărătorule al celor ce pe tine te măresc;\nBucură-te, preabunule aducătorule de bucurie al sufletelor;\nBucură-te, binecuvântare dumnezeiască a credincioșilor;\nBucură-te, bună povățuire a călugărilor;\nBucură-te, Gavriile, îngere al darului!"],"r":[]},{"h":"Condac 13","p":["O, dumnezeieștilor căpetenii ale îngerilor, Mihaile și Gavriile, care stați aproape de scaunul lui Dumnezeu, laudele acestea ale noastre, ca banul văduvei primindu-le, de gheenă ne izbăviți pe noi, ca împreună cu voi să cântăm: Aliluia! (acest condac se zice de trei ori)"],"r":["Apoi se zice Icosul 1 și Condacul 1"]},{"h":"Icos 1","p":["Arhanghele Mihaile, mai-marele cetelor îngerilor celor fără de trup, creat ai fost de Dumnezeu, Ziditorul tuturor; de aceea, cu bucurie, laude de acest fel aducem ție:\nBucură-te, făptură a Minții celei ce a făcut lumea;\nBucură-te, revărsarea luminii celei mai înainte de lumină;\nBucură-te, cel ca focul, care stai aproape de Dumnezeire;\nBucură-te, slujitorule neostenit al Treimii;\nBucură-te, Duh înfocat și nematerial după asemănarea lui Dumnezeu;\nBucură-te, ființă nemuritoare, lăudătoare de Dumnezeu;\nBucură-te, apărătorule de foc al cerului;\nBucură-te, căpetenia oștii celei nematerialnice;\nBucură-te, luminătorule al cetelor celor bine mulțumitoare;\nBucură-te, arzătorule al duhului celui nemulțumitor;\nBucură-te, prin care firea îngerilor s-a întărit;\nBucură-te, prin care satana s-a surpat;\nBucură-te, Mihaile, slujitorule al Legii!"],"r":[]},{"h":"Condac 1","p":["Pe căpeteniile îngerilor Treimii, pe Mihail și Gavriil, să-i lăudăm noi toți, iubitorii de praznic, care ne acoperim cu aripile amândurora și din nevoile cele de multe feluri ne izbăvim, unuia grăind: bucură-te, slujitorule al Legii, iar altuia zicând: bucură-te, îngere al darului!"],"r":[]}]},{"slug":"ioan-rusul","title":"Acatistul Sfântului Ioan Rusul","short":"Sf. Ioan Rusul","source":"https://doxologia.ro/acatistul-sfantului-ioan-rusul","sections":[{"h":"Condacul 1","p":["Veniți, credincioșilor, să-l lăudăm pe cel care, rob fiind, a stăpânit peste patimi! Veniți să-l lăudăm pe cel în care S-a oglindit Răsăritul Răsăriturilor! Celui care din Rusia a fost adus, ca să împartă lumii întregi binecuvântările lui Dumnezeu, să-i cântăm: Bucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Icosul 1","p":["Hrănitu-te-ai din tinerețe cu lumina adevărului, o, preaminunatule Ioane, sorbind dulceața învățăturilor dumnezeiești. Ai urmat cuvântul Celui Care a zis: „Cine crede în Mine să-și ia crucea și să-Mi urmeze Mie”; și pentru aceasta noi te lăudăm:\nBucură-te, podoabă a Bisericii sobornicești, Mireasa lui Hristos;\nBucură-te, masă duhovnicească a celor doritori de curăție;\nBucură-te, odraslă sfântă a pământului rusesc, trimisă la tainic apostolat;\nBucură-te, moștenitor al înfrânării Cuvioșilor Antonie și Teodosie de la Pecerska;\nBucură-te, că ai crescut într-o familie binecredincioasă;\nBucură-te, că ai luptat împotriva turcilor hulitori ai lui Hristos;\nBucură-te, că nu te-ai biruit de deznădejde când ai primit crucea robiei;\nBucură-te, că întărit fiind de Dumnezeu, ai răbdat bătăi nenumărate;\nBucură-te, că scuipările nu au întinat frumusețea ta lăuntrică;\nBucură-te, piatră de care s-au sfărâmat sfaturile cele nelegiuite ale chinuitorilor;\nBucură-te, că deși ți-au ars părul și pielea capului, nu te-ai plecat lor;\nBucură-te, că ai fost vrednic urmaș al cetelor de mucenici și mucenițe;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 2-lea","p":["„Cine poate să mă despartă de dragostea Hristosului meu? Ca rob ascult poruncile tale, dar în credința mea în Domnul Hristos nu îmi ești tu stăpân. Îmi amintesc pătimirile Sale și sunt bucuros să primesc și eu cele mai cumplite chinuri, dar de al meu Iisus Hristos nu mă lepăd”, i-ai spus stăpânului turc, cântând în inima ta: Aliluia!"],"r":[]},{"h":"Icosul al 2-lea","p":["Au părăsit dreapta credință cei care s-au temut de suferință și cei iubitori de desfătări, primind învățăturile rătăcite ale lui Mahomed, dar tu te-ai arătat ca un nou Ilie, neplecându-ți genunchii la dumnezeu străin. Rugându-te să păzești turma lui Hristos de orice înșelare, te cinstim ca pe un părinte al nostru:\nBucură-te, că nu ai cârtit împotriva lui Dumnezeu pentru pătimirile tale;\nBucură-te, că ai primit răstignirea voii tale prin loviturile celor care te prigoneau;\nBucură-te, cel care unindu-te cu Hristos, te-ai asemănat Lui;\nBucură-te, că deși ai fost pus să trăiești între animale, ai viețuit îngerește;\nBucură-te, că prin nevoințele tale grajdul se umplea de bună mireasmă;\nBucură-te, că sfințindu-l prin rugăciune, nu ai primit să te muți din el;\nBucură-te, că te împărtășeai în fiecare săptămână cu Sfintele Taine;\nBucură-te, că ai purtat cu sfială și smerenie numele Botezătorului;\nBucură-te, că ai purtat în minte și în inimă pilda sa jertfelnică;\nBucură-te, că fără tulburare din furtuna încercărilor ai ieșit;\nBucură-te, că prin statornicia în credință ești pildă tuturor;\nBucură-te, candelă care ai ars cu untdelemnul răbdării;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 3-lea","p":["Nu numai credincioșii au priceput sfințenia viețuirii tale, ci și închinătorii lui Allah, căci prin rugăciune ai trimis stăpânului tău o farfurie cu mâncare din Procopie până la Mecca, pe care lucru neputând să-l înțeleagă, toți au strigat: Aliluia!"],"r":[]},{"h":"Icosul al 3-lea","p":["Nimic nu este cu neputință celor care cred cu tărie că Făcătorul cerului și al pământului degrabă plinește rugăciunile lor. Chiar de nu am văzut cu ochii trupești, dar cu inima credem că ai făcut și ceea ce părea cu neputință, numai pentru a arăta stăpânului tău și celor dimpreună cu el puterea Domnului tău. Pentru care îți cântăm:\nBucură-te, că nu te-ai îndoit în credința ta, având nădejde neclintită în Dumnezeu;\nBucură-te, că de la Procopie la Mecca ai trimis o farfurie cu mâncare;\nBucură-te, că deși turcii au râs de tine, ai simțit binecuvântarea cerească;\nBucură-te, că stăpânul tău, întorcându-se acasă, a început să te cinstească;\nBucură-te, că până și cei întunecați la minte au priceput sfințenia ta;\nBucură-te, că la înmormântarea ta au venit chiar și musulmani și armeni;\nBucură-te, că din rânduiala cerească farfuria aceea este și astăzi semn al minunii săvârșite de tine;\nBucură-te, că după multe veacuri arătându-te femeii la care se afla farfuria i-ai cerut să o aducă la biserică;\nBucură-te, că cei care cereau semne și minuni au primit cu prisosință;\nBucură-te, că te-ai asemănat prorocilor din Legea cea veche;\nBucură-te, stavilă care oprești rătăcirile și izgonești lupii de la turma cea cuvântătoare;\nBucură-te, că pe toți i-ai copleșit prin virtuțile și minunile tale;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 4-lea","p":["Nu a ținut Dumnezeu lumina ascunsă sub obroc, ci a rânduit ca moaștele tale întregi și binemirositoare să fie primite de credincioși ca o pecete a binecuvântării tale. Pentru care și noi bucurându-ne cu cei care s-au atins de ele, Îi cântăm Celui Care dă adevărata viață celor care cred în El: Aliluia!"],"r":[]},{"h":"Icosul al 4-lea","p":["Degeaba a încercat vrăjmașul mântuirii, diavolul, să nimicească prin foc moaștele tale, căci trupul tău s-a mișcat în mijlocul flăcărilor ca și cum nu ar fi cunoscut moartea. Turcii care au văzut aceasta s-au înfricoșat și au fugit, lăsând în urmă odoarele bisericii pe care voiau să le fure, iar creștinii s-au umplut de mirare, cântându-ți:\nBucură-te, nou Ilie prin râvna către cele cerești;\nBucură-te, că la fel ca acela te-ai lăsat mistuit de dragostea sfântă;\nBucură-te, că nu îmbrăcămintea, ci trupul tău ne-ai lăsat nouă ca acoperământ;\nBucură-te, că deasupra mormântului tău a strălucit o lumină cerească;\nBucură-te, că găsind moaștele tale, credincioșii au tresăltat cu duhul;\nBucură-te, că toți cei care le sărută iau binecuvântare;\nBucură-te, că închinându-se, găsesc scăpare din frământările lor;\nBucură-te, că ele sunt mărturie că Domnul pe Care L-ai slujit este Adevăratul Dumnezeu;\nBucură-te, că El a dat viață moaștelor tale când au fost aruncate în foc;\nBucură-te, că trupul tău s-a mișcat în mijlocul flăcărilor;\nBucură-te, că a rămas nevătămat, arătând sfințenia ta;\nBucură-te, că a fost adus în Grecia, pentru a fi martor al minunilor tale;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 5-lea","p":["Cine știe mulțimea minunilor tale? Cine cunoaște câtă mulțime de oameni ai ajutat spre slava Dumnezeului părinților noștri? Doar o mică parte din lucrările tale aflând noi, Îi mulțumim Celui Care te-a proslăvit între cei iubiți ai Săi și Îi cântăm: Aliluia!"],"r":[]},{"h":"Icosul al 5-lea","p":["Nou doctor fără de arginți fiind, urmând Doctorului sufletelor și al trupurilor, nu ai pregetat să sari în ajutorul bolnavilor care te-au chemat cu credință, ci le-ai adus grabnică tămăduire. Iar noi, auzind acestea, te lăudăm așa:\nBucură-te, împreună cu Cosma și Damian, cu Chir și Ioan;\nBucură-te, cu toți doctorii fără de plată;\nBucură-te, că nu de la tine, ci de la Domnul ai adus izbăvire din dureri;\nBucură-te, vistierie nesfârșită de tămăduiri;\nBucură-te, că celui paralitic de zece ani i-ai vindecat picioarele;\nBucură-te, că el nu a șovăit a merge la biserica ta să îți mulțumească;\nBucură-te, că prin mir ai dat sănătate unei femei bolnave;\nBucură-te, de laudele celor cinci copii ai ei;\nBucură-te, că asculți rugăciunile copiilor pentru părinții lor;\nBucură-te, că Atanasia a adus bărbatului ei aghiasmă și ulei din candela ta;\nBucură-te, că ungându-se cu credință, acestuia i s-a tămăduit pieptul;\nBucură-te, alinătorul durerilor celor în suferință;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 6-lea","p":["Un bolnav din Atena a refuzat să primească ajutorul doctorului, temându-se că își va pierde viața, dar tu te-ai arătat în vis nepoatei sale, îndemnând-o să-l trimită la acela pentru tămăduire. Auzind că nu i se va întâmpla nimic rău și că vei ține chiar tu mâna celui care îl va opera, el a primit cu încredere sfatul tău și a aflat tămăduirea, pentru care a cântat Domnului cu mulțumire: Aliluia!"],"r":[]},{"h":"Icosul al 6-lea","p":["Vindecând prin harul lui Dumnezeu boli de nevindecat, deși nu ai învățat de la oameni meșteșugul doctoricesc, te-ai arătat mai iscusit decât cei care și l-au însușit pe acesta prin știința lumească. Iar cei care cunosc puterea ajutorului tău îți cântă:\nBucură-te, vas de mir neîmpuținat și de sănătate izvorâtor;\nBucură-te, că vii în sprijinul celor neputincioși pe care îi bântuie deznădejdea;\nBucură-te, cel care prin suferințele tale ai primit darul de a alina suferințele celor aflați în nevoi;\nBucură-te, că ai îndepărtat cheagurile de sânge din capul Vasulei;\nBucură-te, că unui copil i-ai tămăduit picioarele paralizate;\nBucură-te, că mama căreia i-ai vindecat copiii a venit să îți mulțumească;\nBucură-te, cel care vindeci copiii încercați de boală;\nBucură-te, că părinții lor aleargă la tine cu nădejde;\nBucură-te, că unei bătrâne gârbove i-ai îndreptat spatele;\nBucură-te, că în chip de doctor te-ai arătat unui medic necredincios;\nBucură-te, că vindecându-se de cancer, acesta a crezut în Dumnezeu;\nBucură-te, că ai izbăvit de o veche suferință pe preotul care slujea în biserica ta;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 7-lea","p":["„Sfinte Ioane, mă urăști?”, a întrebat cuprinsă de deznădejde Arhondula, părându-i-se că rugăciunile ei pentru a avea urmași nu au avut nici un folos. Tu însă i-ai apărut nu după multă vreme și i-ai spus că sfinții nu urăsc pe nimeni și că voia Domnului era ca să se bucure de copii abia după doi ani. Iar ea, după ce a văzut împlinirea cuvintelor tale, I-a cântat lui Dumnezeu: Aliluia!"],"r":[]},{"h":"Icosul al 7-lea","p":["De multe ori am crezut că rugăciunile noastre sunt zadarnice, că din pricina păcatelor noastre Fața Domnului S-a întors de la noi și că ne așteaptă pierzania, dar la vremea cuvenită El a plinit toate cererile noastre cele bune. Sfinte Ioane, ajută-ne să simțim în toate zilele vieții noastre ocrotirea cerească, să îți putem cânta:\nBucură-te, reazem al celor împovărați de greutățile vieții;\nBucură-te, că auzi suspinele și ștergi lacrimile oamenilor;\nBucură-te, cel care nu te-ai mâniat pe Arhondula care a cârtit împotriva ta;\nBucură-te, cel care i-ai spus că sfinții nu urăsc pe nimeni;\nBucură-te, că deznădejdea care o bântuia i-ai schimbat-o în nădejde;\nBucură-te, că la vremea rânduită de Domnul, ea s-a învrednicit să aibă copii;\nBucură-te, că pentru răbdarea ei a fost răsplătită nu doar cu un copil, ci cu mai mulți;\nBucură-te, că ne-ai întărit evlavia față de cei proslăviți de Dumnezeu;\nBucură-te, podoabă cerească ce nu cruți osteneala pentru a-i sprijini pe oameni;\nBucură-te, folositorul cel preacald al credincioșilor care cred minunilor tale;\nBucură-te, că familia ta este Biserica Mântuitorului;\nBucură-te, că celor care nu fug de greutățile vieții le dai curajul să iasă întăriți din ele;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 8-lea","p":["Ca o fiară urla Caterina, când era chinuită de diavol, înspăimântându-i pe cei care o vedeau, dar a alergat fără să se îndoiască la ajutorul tău și apărându-i în vis i-ai vestit izbăvirea. Și noi cădem, Sfinte Ioane, înaintea ta, rugându-te să îi eliberezi pe toți cei care sunt robiți de îngerii căzuți, ca să cânte împreună cu noi Celui Care a înfrânt puterile întunericului: Aliluia!"],"r":[]},{"h":"Icosul al 8-lea","p":["Cazi înaintea Tronului Dumnezeirii, Sfinte Ioane, și mijlocește pentru toți cei care suntem ispitiți de vrăjmașul diavol, ca să primim ajutor în lupta duhovnicească și să dobândim tărie în credință noi, cei care te lăudăm:\nBucură-te, că ai gonit pe diavolul care o chinuia pe Caterina;\nBucură-te, că după aceasta mulți demonizați au fost aduși la racla ta;\nBucură-te, purtătorule de Duh Sfânt care ai mijlocit tămăduirea lor;\nBucură-te, că prin lacrimi și nevoințe i-ai înfricoșat pe diavoli;\nBucură-te, căderea nelegiuiților vrăjmași și ridicarea celor care luptă cu aceștia;\nBucură-te, lanț care fereci pe făptuitorul celor rele;\nBucură-te, că pe cei care suferă de tulburările minții îi izbăvești;\nBucură-te, cel care având harisma deosebirii vezi lucrarea diavolului;\nBucură-te, că ne povățuiești cum să scăpăm din cursele lui viclene;\nBucură-te, că și în vremurile de pe urmă vei fi călăuză pentru credincioși;\nBucură-te, că împreună cu tot soborul sfinților vei veghea asupra lor;\nBucură-te, cel care prin suportarea prigonirii ai ajuns pavăză pentru creștinii prigoniți;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 9-lea","p":["Precum s-a întors fiul cel risipitor la tatăl său, așa și tânărul Tanasis, care după multe răutăți a ajuns să își lovească mama, prin tainica ta mijlocire s-a întors cuprins de pocăință înapoi la dragostea cea firească, la fel I-ai cântat Dumnezeului îndurărilor: Aliluia!"],"r":[]},{"h":"Icosul al 9-lea","p":["Mulți sunt cei care apucă pe drumuri greșite, iar rudele lor sunt cuprinse de jale. Vino și întoarce-i la slujirea lui Hristos pe cei care au căzut în păcat, fiind prinși în cursele vrăjmașilor și biruiți de patimile ucigătoare de suflet, ca să îți cânte alături de noi:\nBucură-te, rudă duhovnicească a Sfântului Stelian;\nBucură-te, cel care ocrotitor al tinerilor fiind, te întristezi de căderile lor;\nBucură-te, mângâiere preadulce pentru părinții fiilor risipitori;\nBucură-te, că mama lui Tanasis și-a văzut dorința împlinită;\nBucură-te, că văzându-și fiul acasă, s-a bucurat împreună cu cetele îngerești;\nBucură-te, că te îngrijești ca cei care s-au pocăit să nu se întoarcă la cele rele;\nBucură-te, că îi liniștești pe cei care suferă amar pentru căderile celor apropiați lor;\nBucură-te, că dai nădejde în mila Celui Care a venit pentru cei păcătoși;\nBucură-te, că nici o cădere nu poate stăvili rânduiala lui Dumnezeu;\nBucură-te, cel care ne înveți să urâm păcatul, fără a-i judeca pe cei care cad în el;\nBucură-te, cel care ne ajuți să ne vindecăm de slăbiciunile noastre ascunse;\nBucură-te, că ne îndemni să ne rugăm unii pentru alții;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 10-lea","p":["Deși văduva care fusese lipsită de casă nu ți-a cerut niciodată ajutorul, plângerea a ajuns și la urechile tale, și tu nu ai șovăit să o liniștești, încurajând-o să se ducă la judecată pentru a dobândi ce i se cuvenea. Știind că mijlocirea ta este mai tare decât cerbicia judecătorilor iubitori de arginți, te chemăm și noi în ajutorul celor nedreptățiți, al celor care Îi cântă Dreptului Judecător: Aliluia!"],"r":[]},{"h":"Icosul al 10-lea","p":["Arzătoare fiind dragostea ta pentru oameni, nu numai pe cei care au auzit de numele tău îi ajuți, ci și pe mulți dintre cei greu încercați de nevoi. Să nu rămână departe de mila ta cei pe care îi poți ajuta, ca văzând puterea ta să îți cânte, împreună cu noi:\nBucură-te, că ai ajutat-o pe văduva pe care rudele voiau să o înșele;\nBucură-te, că ai așezat-o în casa care i-a rămas moștenire;\nBucură-te, că s-au rușinat cei care cugetau vicleșuguri cu nerușinare;\nBucură-te, că ai sărit în ajutorul celei rămase fără ajutor de la oameni;\nBucură-te, că pe mulți alții i-ai izbăvit din cursele vrăjmașilor;\nBucură-te, că trăiești fericirea celor însetați de dreptate;\nBucură-te, prigonitorule al celor care prigonesc;\nBucură-te, luptător destoinic împotriva înșelătoriei, furtișagului și nedreptății;\nBucură-te, cel care răstorni urzelile judecătorilor nevrednici;\nBucură-te, că ești iscusit judecător și nu te pot înșela cei care ți se roagă cu fățărnicie;\nBucură-te, balanță a Dreptului Judecător, spre care alergăm în necazuri;\nBucură-te, cel care îi îmbraci pe cei săraci și îi hrănești pe cei flămânzi;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 11-lea","p":["De multe ori uităm să îi prăznuim pe cei de care lumea nu a fost vrednică, pe sfinții care au strălucit printr-o viețuire aleasă luminând pământul. Tu, dar, Sfinte Ioane, te bucuri împreună cu ei când cinstim pomenirea voastră și pentru că v-a rânduit ca apărători ai noștri Îi mulțumim Domnului prin cântarea: Aliluia!"],"r":[]},{"h":"Icosul al 11-lea","p":["„Așa sunt uitați prietenii?”, l-ai întrebat pe bătrânul Nicolae care nu și-a adus aminte că este praznicul tău, iar el, auzind blânda ta mustrare, a lăsat toate ca să vină și să se închine ție și să-ți cânte împreună cu cei care te iubesc ca pe un ocrotitor al lor:\nBucură-te, că prin pomenirea ta poți ajuta credincioșilor;\nBucură-te, că prin tine ni s-a arătat că sfinții nu trec cu vederea prăznuirea lor;\nBucură-te, că prin aceasta am fost îndemnați să-i cinstim cu și mai multă evlavie;\nBucură-te, că nu te-ai sfiit să-l mustri fără de răutate pe bătrânul Nicolae;\nBucură-te, că auzindu-te el, a venit grabnic la moaștele tale;\nBucură-te, că s-au înălțat către tine rugăciunile sale smerite;\nBucură-te, cel care aștepți să avem și noi credință curată ca a sa;\nBucură-te, că nu te îndepărtezi nici de cei care nu știu să se roage ție;\nBucură-te, prietene al celor care vor să le fii aproape;\nBucură-te, cel care nevăzut călătorești alături de ei pe marea vieții;\nBucură-te, că ne chemi să cinstim și noi cum se cuvine pomenirea ta;\nBucură-te, că le dai credincioșilor cele de trebuință pentru a veni la biserica ta;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 12-lea","p":["Nu vom uita, Sfinte Ioane, mulțimea minunilor tale prin care a strălucit puterea Adevăratului tău Stăpân. Ajută-ne ca până la sfârșitul vieții noastre să rămânem fii credincioși ai Sfintei Biserici, ca să nu încetăm a o lăuda: Aliluia!"],"r":[]},{"h":"Icosul al 12-lea","p":["Slavă lui Dumnezeu pentru toate! Slavă lui Dumnezeu pentru mulțimea de sfinți care au crescut în Biserica Sa, unde a înflorit și Sfântul Ioan Rusul! Nespusă este tresăltarea inimilor noastre când îți aducem cântări de laudă, Sfinte Ioane, făcătorule de minuni:\nBucură-te, icoană zugrăvită de Împăratul Ceresc spre întărirea credincioșilor;\nBucură-te, temei de împăcare al celor biruiți de mânie și răutate;\nBucură-te, bucurie a celor care află de minunile tale;\nBucură-te, dar dumnezeiesc în viețile noastre greu încercate de felurite necazuri;\nBucură-te, cel care cu negrăită dulceață îi îndreptezi pe cei nepricepuți;\nBucură-te, dascălul și îndrumătorul nostru pe calea virtuții;\nBucură-te, îndreptătorul celor fără de socoteală;\nBucură-te, totdeauna izbăvitor al celor care te cheamă în primejdii;\nBucură-te, cel care nu ai cruțat osteneala pentru a face bunătate;\nBucură-te, că ne dai ajutor cu îmbelșugare în toată vremea;\nBucură-te, că ne arăți nouă milele lui Dumnezeu;\nBucură-te, și pregătește-ne să ne bucurăm împreună cu tine în Rai;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul al 13-lea","p":["O, Sfinte Ioane, vlăstar al Rusiei și făclie a Bisericii lui Hristos, primește acum puțina noastră rugăciune și nu ne lăsa fără răspuns. Deși nu avem credința celor care au cerut ajutorul tău și l-au primit cu îndestulare, credem că ne poți ajuta și pe noi, ca să slăvim cu mulțumire Numele lui Dumnezeu prin laude și cântări: Aliluia! (acest condac se zice de trei ori)"],"r":["Apoi se zice Icosul 1 și Condacul 1"]},{"h":"Icosul 1","p":["Hrănitu-te-ai din tinerețe cu lumina adevărului, o, preaminunatule Ioane, sorbind dulceața învățăturilor dumnezeiești. Ai urmat cuvântul Celui Care a zis: „Cine crede în Mine să-și ia crucea și să-Mi urmeze Mie”; și pentru aceasta noi te lăudăm:\nBucură-te, podoabă a Bisericii sobornicești, Mireasa lui Hristos;\nBucură-te, masă duhovnicească a celor doritori de curăție;\nBucură-te, odraslă sfântă a pământului rusesc, trimisă la tainic apostolat;\nBucură-te, moștenitor al înfrânării Cuvioșilor Antonie și Teodosie de la Pecerska;\nBucură-te, că ai crescut într-o familie binecredincioasă;\nBucură-te, că ai luptat împotriva turcilor hulitori ai lui Hristos;\nBucură-te, că nu te-ai biruit de deznădejde când ai primit crucea robiei;\nBucură-te, că întărit fiind de Dumnezeu, ai răbdat bătăi nenumărate;\nBucură-te, că scuipările nu au întinat frumusețea ta lăuntrică;\nBucură-te, piatră de care s-au sfărâmat sfaturile cele nelegiuite ale chinuitorilor;\nBucură-te, că deși ți-au ars părul și pielea capului, nu te-ai plecat lor;\nBucură-te, că ai fost vrednic urmaș al cetelor de mucenici și mucenițe;\nBucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Condacul 1","p":["Veniți, credincioșilor, să-l lăudăm pe cel care, rob fiind, a stăpânit peste patimi! Veniți să-l lăudăm pe cel în care S-a oglindit Răsăritul Răsăriturilor! Celui care din Rusia a fost adus, ca să împartă lumii întregi binecuvântările lui Dumnezeu, să-i cântăm: Bucură-te, Sfinte Ioane, alesule mărturisitor al lui Hristos!"],"r":[]},{"h":"Rugăciune către Sfântul Ioan Rusul","p":["O, Sfinte Ioane, întru tot lăudate și de minuni făcătorule, primește această umilă rugăciune de la noi, nevrednicii tăi robi, căci către tine ca la un grabnic folositor alergăm noi, chemându-te cu evlavie: vino, Sfinte Ioane, și vezi rănile și durerile noastre. Ia aminte la suspinele noastre, că știm, Sfinte al lui Dumnezeu, că deși ai pătimit greu pentru dragostea lui Hristos, prin viețuirea ta ai aflat dar de la Dumnezeu, fiindcă ne-am încredințat că și după mutarea ta la viața cea veșnică cine a năzuit la ajutorul tău și ți s-a rugat cu credință și a rămas neajutat? Că cine te-a chemat și tu l-ai trecut cu vederea? Sau cine s-a rugat ție și nu l-ai auzit? Minunile și ajutorul tău, Sfinte Ioane, ne-au făcut și pe noi, păcătoșii, să alergăm la ajutorul tău. Am auzit de minunea pe care ai făcut-o trimițând prin rugăciune o farfurie de mâncare din Procopie până la Mecca. Am aflat de vindecările tale minunate, de mulțimea de bolnavi care au aflat izbăvire din suferințele lor. Credem că Dumnezeu te-a proslăvit prin minuni fără de număr. Oare pe noi ne vei lăsa fără ajutor? Să nu fim noi lepădați de la dragostea ta, Sfinte Ioane, chiar dacă viețile noastre sunt pline de fărădelegi.","Aducându-ne aminte de mijlocirile tale binecuvântate, credem că tu același ești, Sfinte Ioane, astăzi ca și atunci și că nimeni dintre cei care se roagă ție nu rămâne fără ajutor. Pentru aceea și noi, fiind în necazuri și în pagube, alergăm la tine cu credință și lacrimi, îngenunchind, și ne rugăm ție, Sfinte Ioane, să te rogi pentru noi lui Hristos, Fiul lui Dumnezeu, Celui Care n-a trecut cu vederea rugăciunea ta cea jertfelnică, ci te-a ascultat și te-a întărit și te-a primit în cereștile lăcașuri. Pe Acesta roagă-L să depărteze de la noi dreapta Sa mânie, să apere orașele, satele și toată țara noastră de secetă, de foamete, de furtuni năprasnice, de cutremur, de boli și răni aducătoare de moarte, de năvălirea asupra noastră a altor neamuri și de războiul cel dintre noi.","Mijlocește, Sfinte Ioane, creștinilor râvnă fierbinte către Dumnezeu, purtare de grijă pentru mântuire, înțelepciune în purtare și învățătură, cucernicie și tărie în ispite; tuturor cârmuitorilor purtare de grijă față de supuși, iar supușilor, îndeplinirea cu sârguință a tuturor îndatoririlor lor, ca astfel, în pace și cu cucernicie să petrecem veacul acesta. Să ne învrednicim de împărtășirea bunătăților celor veșnice în Împărăția Mântuitorului nostru Iisus Hristos, Căruia I se cuvine cinste și închinăciune, împreună cu Tatăl Cel fără de început și cu Preasfântul Duh, acum și pururea și în vecii vecilor. Amin."],"r":[]},{"h":"Rugăciune care se citește la vreme de boală","p":["Bucurându-mă de dumnezeiasca mărire la care te-ai înălțat, o, Sfinte Ioane, îndrăznesc să alerg la ajutorul tău pentru tămăduire. Știu, părinte, că încercările vin din rânduiala lui Dumnezeu. Știu că prin boala trupului sufletul se curățește și că răbdarea este răsplătită de Dumnezeu. Dar de multe ori norii negri ai deznădejdii îmi tulbură mintea și mă depărtează de rugăciune. De aceea, dar, o, Sfinte, găsesc alinare în cugetarea la vindecările tale minunate. Tu ai tămăduit mulțimea de copii spre bucuria părinților lor. Tu ai îndreptat spatele bătrânei gârbove, tu ai dat sănătate femeii bolnave, spre bucuria copiilor ei. Tu l-ai vindecat pe bătrânul Atanasie care s-a uns cu untdelemn din candela ta. Tu ai îndepărtat cheagurile de sânge din capul Vasulei și l-ai tămăduit pe doctorul necredincios. Știind grabnica ta mijlocire, te rog, o, Sfinte Ioane, ia viața mea în mâinile tale și mijlocește precum știi mântuirea mea. Dacă voia Domnului este să duc cu răbdare crucea bolii, dă-mi putere și ajută-mă să nu cârtesc din cauza neputințelor. Dar dacă Bunul Dumnezeu Se va milostivi de mine pentru rugăciunile tale, atunci să mă tămăduiești fără șovăială, noule doctor fără de arginți, ca văzând aceasta să-ți mulțumesc ție și să-L laud în vecii vecilor pe Doctorul sufletelor și al trupurilor, prin cântarea: Aliluia!"],"r":[]}]},{"slug":"buna-vestire","title":"Acatistul Bunei Vestiri","short":"Buna Vestire","source":"https://doxologia.ro/acatistul-bunei-vestiri","sections":[{"h":"Condac 1","p":["Apărătoare Doamnă, pentru biruință, mulțumiri, izbăvindu-ne din nevoi, aducem ție, Născătoare de Dumnezeu, noi, robii tăi. Ci, ca aceea ce ai stăpânire nebiruită, izbăvește-ne din toate nevoile, ca să strigăm ție: Bucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Icos 1","p":["Îngerul cel întîistătător din Cer a fost trimis să zică Născătoarei de Dumnezeu: Bucură-te! Și împreună cu glasul cel netrupesc, văzându-Te pe Tine, Doamne, Întrupat, s-a înspăimântat și i-a stat înainte, grăind către dânsa unele ca acestea:\nBucură-te, cea prin care răsare bucuria,\nBucură-te, cea prin care piere blestemul,\nBucură-te, chemarea lui Adam celui căzut,\nBucură-te, izbăvirea lacrimilor Evei,\nBucură-te, înălțime, întru care anevoie se suie gândurile omenești,\nBucură-te, adâncime, care nu te poți vedea lesne cu ochii îngerești,\nBucură-te, că ești scaun Împăratului,\nBucură-te, că porți pe Cel ce poartă toate,\nBucură-te, steaua, care arăți Soarele,\nBucură-te, pântecele dumnezeieștii întrupări,\nBucură-te, cea prin care se înnoiește făptura,\nBucură-te, cea prin care Prunc Se face Făcătorul,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 2","p":["Știindu-se pe sine sfânta întru curăție, a zis lui Gavriil cu îndrăznire: Preaslăvitul tău glas cu anevoie se arată a fi primit sufletului meu, că naștere cu zămislire fără sămânță, cum îmi spui, cântând: Aliluia?"],"r":[]},{"h":"Icos 2","p":["Înțelesul cel greu de pătruns căutând Fecioara să-l înțeleagă, a grăit către cel ce slujea: Din pântece curat, cum este cu putință să Se nască Fiu, spune-mi? Iar el cu frică a zis:\nBucură-te, tăinuitoarea sfatului celui nespus,\nBucură-te, încredințarea celor ce au trebuință de tăcere,\nBucură-te, începătura minunilor lui Hristos,\nBucură-te, capul poruncilor Lui,\nBucură-te, scara Cerului, pe care S-a pogorât Dumnezeu,\nBucură-te, pod care-i treci la Cer pe cei de pe pământ,\nBucură-te, minune, care de îngeri ești mult slăvită,\nBucură-te, ceea ce ești rană de mult plâns a diavolilor,\nBucură-te, ceea ce ai născut Lumina cea neapusă,\nBucură-te, ceea ce n-ai învățat pe nimeni în ce chip s-a petrecut,\nBucură-te, ceea ce covârșești mintea celor înțelepți,\nBucură-te, ceea ce luminezi gândurile celor credincioși,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 3","p":["Puterea Celui de Sus a umbrit-o atunci, spre zămislire, pe cea care nu știa de nuntă, și pântecele ei cel cu bună roadă, ca o țarină dulce, l-a arătat tuturor celor ce vor să secere mântuire, când vor cânta așa: Aliluia!"],"r":[]},{"h":"Icos 3","p":["Având Fecioara primit în pântece pe Dumnezeu, a alergat la Elisabeta; iar pruncul acesteia, îndată cunoscând închinarea ei, s-a bucurat și, cu săltări în pântece, ca și cum ar fi cântat, a grăit către Născătoarea de Dumnezeu:\nBucură-te, vița mlădiței celei ne-veștejite\nBucură-te, câștigarea rodului celui fără de moarte,\nBucură-te, ceea ce ai lucrat pe Lucrătorul iubirii de oameni,\nBucură-te, ceea ce ai născut pe Săditorul vieții noastre,\nBucură-te, brazdă care ai crescut înmulțirea milelor,\nBucură-te, masă care porți îndestularea milostivilor,\nBucură-te, ceea ce înflorești Raiul desfătării,\nBucură-te, ceea ce gătești adăpostire sufletelor,\nBucură-te, tămâia rugăciunii celei primite,\nBucură-te, curăția a toată lumea,\nBucură-te, voia cea bună a lui Dumnezeu către noi, cei muritori,\nBucură-te, îndrăznirea celor muritori către Dumnezeu,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 4","p":["Vifor de gânduri necredincioase având în sine, înțeleptul Iosif s-a tulburat, uitându-se la tine, cea neamestecată cu nunta, gândind că ești furată de nuntă, tu, ceea ce ești fără de prihană. Iar când a cunoscut că zămislirea ta este de la Duhul Sfânt, a zis: Aliluia!"],"r":[]},{"h":"Icos 4","p":["Au auzit păstorii pe îngeri lăudând venirea lui Hristos în trup și, alergând la Acela ca la un păstor, L-au văzut ca pe un miel fără de prihană în brațele Mariei, pe care lăudând-o, au zis:\nBucură-te, Maica Mielului și a Păstorului,\nBucură-te, staulul oilor cuvântătoare,\nBucură-te, ceea ce ești chinuire pentru vrăjmașii cei nevăzuți,\nBucură-te, ceea ce deschizi ușile Raiului,\nBucură-te, că cele cerești se bucură cu cele pământești,\nBucură-te, că cele pământești dănțuiesc împreună cu cele cerești,\nBucură-te, gura apostolilor cea fără de tăcere,\nBucură-te, îndrăznirea cea nebiruită a purtătorilor de chinuri,\nBucură-te, temeiul cel tare al credinței,\nBucură-te, cunoștința harului cea luminoasă,\nBucură-te, cea prin care s-a golit iadul,\nBucură-te, cea prin care ne-am îmbrăcat cu slavă,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 5","p":["Steaua cea cu dumnezeiască mergere văzând-o magii, au mers pe urma luminii ei; și, ținând-o ca pe o făclie, cu dânsa căutau pe puternicul Împărat; și, ajungând la Cel neajuns, s-au bucurat cântându-I: Aliluia!"],"r":[]},{"h":"Icos 5","p":["Au văzut pruncii haldeilor în brațele Fecioarei pe Cel ce a zidit pe om cu mâna; și, cunoscându-L a le fi Stăpân, deși luase chip de rob, s-au nevoit cu daruri a-I sluji Lui și a-i cânta celei binecuvântate:\nBucură-te, Maica stelei celei neapuse,\nBucură-te, raza zilei celei de taină,\nBucură-te, ceea ce ai stins cuptorul înșelăciunii,\nBucură-te, ceea ce luminezi pe tăinuitorii Treimii,\nBucură-te, ceea ce ai aruncat dintru dregătorie pe tiranul cel fără de omenie,\nBucură-te, ceea ce ai arătat pe Domnul Hristos, iubitorul de oameni,\nBucură-te, ceea ce ne-ai izbăvit din slujirea cea idolească,\nBucură-te, ceea ce ne curățești de lucrurile cele întinate,\nBucură-te, ceea ce ai stins închinarea la foc,\nBucură-te, ceea ce ne-ai potolit văpaia patimilor,\nBucură-te, îndreptătoarea înțelepciunii celor credincioși,\nBucură-te, veselia tuturor neamurilor,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 6","p":["Vestitori purtători de Dumnezeu făcându-se magii, s-au întors în Babilon, săvârșind prorocia Ta; și, mărturisindu-Te tuturor pe Tine, Hristoase, au lăsat pe Irod ca pe un mincinos, că nu știa să cânte: Aliluia!"],"r":[]},{"h":"Icos 6","p":["Strălucind Tu în Egipt, Lumina adevărului, ai izgonit întunericul minciunii. Că idolii lui, Mântuitorule, nerăbdând tăria Ta, au căzut; iar cei ce s-au izbăvit de dânșii cântau către Născătoarea de Dumnezeu:\nBucură-te, îndreptarea oamenilor,\nBucură-te, căderea demonilor,\nBucură-te, ceea ce ai zdrobit stăpânia înșelăciunii,\nBucură-te, ceea ce ai vădit înșelăciunea idolească,\nBucură-te, mare care ai înecat pe faraonul cel netrupesc,\nBucură-te, piatră care ai adăpat pe cei însetați de viață,\nBucură-te, stâlp de foc care povățuiești pe cei dintru întuneric,\nBucură-te, acoperământul lumii cel mai lat decât norul,\nBucură-te, hrană și potir cu mană,\nBucură-te, slujitoarea bucuriei celei sfinte,\nBucură-te, pământul făgăduinței,\nBucură-te, izvorâtoare de miere și lapte,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 7","p":["Vrând Simeon să se mute din veacul acesta înșelător, Te-ai dat lui ca un prunc, dar Te-ai făcut cunoscut lui și ca Dumnezeu desăvârșit. Pentru aceea s-a mirat de înțelepciunea Ta cea nespusă, cântând: Aliluia!"],"r":[]},{"h":"Icos 7","p":["Arătat-a făptură nouă arătându-Se Făcătorul nouă, celor ce suntem făcuți de Dânsul, răsărind din pântecele cel fără de sămânță și păzindu-l întreg, precum a fost; ca noi, văzând minunea, să o lăudăm, grăind:\nBucură-te, floarea nestricăciunii,\nBucură-te, cununa înfrânării,\nBucură-te, ceea ce ai strălucit chipul Învierii,\nBucură-te, ceea ce ai arătat viața îngerească,\nBucură-te, pomul cel cu luminoasă roadă, din care se hrănesc credincioșii,\nBucură-te, copacul cel înfrunzit cu bună umbră, sub care mulți se odihnesc,\nBucură-te, ceea ce ai purtat în pântece pe Îndreptătorul celor rătăciți,\nBucură-te, ceea ce ai născut pe Izbăvitorul celor robiți,\nBucură-te, îmblânzirea Judecătorului celui drept,\nBucură-te, iertarea multor greșiți,\nBucură-te, haina celor goi de îndrăzneală,\nBucură-te, dragostea care biruiește toată dorirea,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 8","p":["Văzând naștere minunată, să ne înstrăinăm de lume, mutându-ne mintea la Cer; că pentru aceasta Preaînaltul Dumnezeu pe pământ S-a arătat Om smerit, vrând să tragă la înălțime pe cei care-I cântă: Aliluia!"],"r":[]},{"h":"Icos 8","p":["Cu totul a fost între cei de jos, iar de cei de Sus nicicum nu S-a depărtat Cuvântul cel necuprins; că dumnezeiască pogorâre a fost, iar nu mutare din loc, și naștere din Fecioară primitoare de Dumnezeu, care aude acestea:\nBucură-te, încăperea lui Dumnezeu celui neîncăput,\nBucură-te, ușa tainei celei de cinste,\nBucură-te, auzirea cea cu nepricepere pentru cei necredincioși,\nBucură-te, lauda cea fără de îndoială a celor credincioși,\nBucură-te, purtătoarea cea preasfântă a Celui ce este pe heruvimi,\nBucură-te, sălașul cel preaslăvit al Celui ce este pe serafimi,\nBucură-te, ceea ce ai adunat lucruri potrivnice întru una,\nBucură-te, ceea ce ai unit fecioria și nașterea,\nBucură-te, cea prin care s-a dezlegat călcarea poruncii,\nBucură-te, cea prin care s-a deschis Raiul,\nBucură-te, cheia Împărăției lui Hristos,\nBucură-te, nădejdea bunătăților celor veșnice,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 9","p":["Toată firea îngerească s-a minunat de lucrul cel mare al întrupării lui Hristos; că pe Cel neapropiat, ca Dumnezeu, L-a văzut Om apropiat tuturor, petrecând împreună cu noi și auzind de la toți: Aliluia!"],"r":[]},{"h":"Icos 9","p":["Pe oratorii cei mult-vorbitori îi vedem tăcând ca niște pești fără de glas, despre tine, Născătoare de Dumnezeu, că nu se pricep să spună în ce chip și Fecioară ai rămas, și ai putut naște. Iar noi, minunându-ne de o taină ca aceasta, cu credință cântăm:\nBucură-te, sălașul înțelepciunii lui Dumnezeu,\nBucură-te, comoara rânduielii Lui,\nBucură-te, ceea ce îi arăți pe filosofi neînțelepți,\nBucură-te, ceea ce ai vădit pe cei meșteri la cuvânt a fi necuvântători,\nBucură-te, că au înnebunit întrebătorii cei cumpliți,\nBucură-te, că s-au veștejit făcătorii de basme,\nBucură-te, ceea ce ai risipit vorbele cele încâlcite ale atenienilor,\nBucură-te, ceea ce ai umplut mrejele pescarilor,\nBucură-te, ceea ce ne-ai ridicat din adâncul necunoștinței,\nBucură-te, ceea ce pe mulți i-ai luminat la minte,\nBucură-te, corabia celor ce vor să se mântuiască,\nBucură-te, limanul celor ce umblă cu corăbiile acestei vieți,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 10","p":["Vrând să mântuiască lumea, Împodobitorul tuturor a venit la ea, așa cum Însuși făgăduise; și, Păstor fiind, ca un Dumnezeu, pentru noi S-a arătat om ca și noi. Căci, cu asemănarea chemând pe cel asemenea, ca un Dumnezeu aude: Aliluia!"],"r":[]},{"h":"Icos 10","p":["Zid ești fecioarelor, Născătoare de Dumnezeu Fecioară, și tuturor celor ce aleargă la tine, că Făcătorul cerului și al pământului te-a gătit pe tine, Curată, sălășluindu-Se în pântecele tău și învățând pe toți să îți cânte:\nBucură-te, turnul fecioriei,\nBucură-te, ușa mântuirii,\nBucură-te, începătoarea prefacerii celei pline de înțeles,\nBucură-te, dătătoarea darului celui dumnezeiesc,\nBucură-te, că tu ai înnoit pe cei zămisliți întru rușine,\nBucură-te, că tu ai învățat pe cei lipsiți de minte,\nBucură-te, ceea ce ai stricat pe stricătorul gândurilor,\nBucură-te, ceea ce ai născut pe Semănătorul curăției,\nBucură-te, cămara nunții celei fără de sămânță,\nBucură-te, ceea ce ai unit cu Domnul pe cei credincioși,\nBucură-te, ceea ce între fecioare singură ai fost hrănitoare de prunc,\nBucură-te, cămara cea împodobită a sufletelor sfinților,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 11","p":["Împărate sfinte, de Ți-am aduce cântări și psalmi la număr întocmai ca nisipul, nimic nu plinim cum se cuvine, căci se biruiește toată cântarea care se îndreaptă către mulțimea milelor Tale celor multe, pe care le-ai dat celor ce-Ți cântă: Aliluia!"],"r":[]},{"h":"Icos 11","p":["Făclie primitoare de lumină, arătată celor ce sunt întru întuneric, o vedem pe Preasfânta Fecioară; că, aprinzând în sine Focul cel netrupesc, pe toți îi îndreptează spre cunoștința cea dumnezeiască ce luminează mintea cu raza ei și se cinstește cu chemarea aceasta:\nBucură-te, raza Soarelui celui înțelegător,\nBucură-te, raza Luminii celei neapuse,\nBucură-te, fulgerul care luminezi sufletele,\nBucură-te, ceea ce îi îngrozești pe vrăjmași ca un tunet,\nBucură-te, că dintru tine a răsărit strălucirea cea cu multă lumină,\nBucură-te, că ai izvorât râul care curge cu ape multe,\nBucură-te, ceea ce te-ai arătat icoană a cristelniței,\nBucură-te, ceea ce curățești întinăciunea păcatului,\nBucură-te, baie, care speli conștiința,\nBucură-te, pahar, care dai gust bucuriei,\nBucură-te, mireasma mirosului celui bun al lui Hristos,\nBucură-te, viața veseliei celei de taină,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 12","p":["Vrând să dea har datoriilor celor de demult, Dezlegătorul tuturor datoriilor omenești a venit Singur la cei ce se îndepărtaseră de harul Lui și, rupând zapisul, aude de la toți cântarea: Aliluia!"],"r":[]},{"h":"Icos 12","p":["Cântând nașterea ta, te lăudăm toți, ca pe o biserică însuflețită, Născătoare de Dumnezeu; că, locuind în pântecele tău Domnul, Care ține toate cu mâna, a sfințit, a slăvit și a învățat pe toți să-ți cânte:\nBucură-te, locașul lui Dumnezeu-Cuvântul,\nBucură-te, sfântă care ești mai mare decât toți sfinții,\nBucură-te, chivot poleit cu Duhul,\nBucură-te, comoara vieții cea nedeșertată,\nBucură-te, coroana cea scumpă a împăraților celor credincioși,\nBucură-te, lauda cea de cinste a preoților cuvioși,\nBucură-te, stâlp neclintit al Bisericii,\nBucură-te, zidul cel nebiruit al Împărăției,\nBucură-te, cea prin care se înalță biruințele,\nBucură-te, cea prin care cad vrăjmașii,\nBucură-te, tămăduirea trupului meu,\nBucură-te, mântuirea sufletului meu,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 13","p":["O, Maică prealăudată, care ai născut pe Cuvântul, Cel ce este mai sfânt decât toți sfinții, primind acest dar de acum, izbăvește de toată ispita și scoate din chinul ce va să fie pe toți cei care-ți cântă: Aliluia! (acest condac se zice de trei ori)"],"r":["Apoi se zice Icosul 1 și Condacul 1"]},{"h":"Icos 1","p":["Îngerul cel întîistătător din Cer a fost trimis să zică Născătoarei de Dumnezeu: Bucură-te! Și împreună cu glasul cel netrupesc, văzându-Te pe Tine, Doamne, Întrupat, s-a înspăimântat și i-a stat înainte, grăind către dânsa unele ca acestea:\nBucură-te, cea prin care răsare bucuria,\nBucură-te, cea prin care piere blestemul,\nBucură-te, chemarea lui Adam celui căzut,\nBucură-te, izbăvirea lacrimilor Evei,\nBucură-te, înălțime, întru care anevoie se suie gândurile omenești,\nBucură-te, adâncime, care nu te poți vedea lesne cu ochii îngerești,\nBucură-te, că ești scaun Împăratului,\nBucură-te, că porți pe Cel ce poartă toate,\nBucură-te, steaua, care arăți Soarele,\nBucură-te, pântecele dumnezeieștii întrupări,\nBucură-te, cea prin care se înnoiește făptura,\nBucură-te, cea prin care Prunc Se face Făcătorul,\nBucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Condac 1","p":["Apărătoare Doamnă, pentru biruință, mulțumiri, izbăvindu-ne din nevoi, aducem ție, Născătoare de Dumnezeu, noi, robii tăi. Ci, ca aceea ce ai stăpânire nebiruită, izbăvește-ne din toate nevoile, ca să strigăm ție: Bucură-te, Mireasă, pururea Fecioară!"],"r":[]},{"h":"Rugăciune către Preasfânta Născătoare de Dumnezeu","p":["O, Preasfântă Născătoare de Dumnezeu, Fecioară stăpână, ceea ce ești mai înaltă și mai presus decât îngerii și arhanghelii și mai cinstită decât toată făptura; mirarea cea mare a îngerilor, propovăduirea prorocilor, podoaba cea aleasă a arhanghelilor, întărirea cea tare a mucenicilor, lauda cea preamărită a apostolilor, povățuitoarea cea tare a călugărilor, înfrânarea cea tare a postitorilor, curăția și slava fecioarelor, veselia cea lină a maicilor, înțelepciunea și învățătura pruncilor, cârmuitoarea săracilor și a văduvelor; îmbrăcăminte celor goi, sănătate celor bolnavi, izbăvire celor robiți; liniște celor de pe mare, liman bun celor înviforați, povățuitoare neostenită celor rătăciți, mergere ușoară celor călători, odihnă bună celor osteniți, acoperământ și scăpare celor asupriți; nădejde celor fără de nădejde, ajutătoare celor lipsiți; celor săraci bogăție neîmpuținată, celor întristați de-a pururea mângâiere, celor pe care nu-i iubește nimeni iubire cu smerenie; celor păcătoși mântuire către Dumnezeu; tuturor creștinilor ocrotire tare, ajutătoare nebiruită și folositoare.","Prin tine, Cel nevăzut S-a făcut văzut, pentru care aducem rugăciune ție noi, robii tăi, Doamna noastră. O, preamilostivă împărăteasă a luminii celei înțelegătoare și preamărită, care ai născut pe Împăratul nostru, Hristos Dumnezeu, Cel ce dă viață tuturor, ceea ce ești slăvită de cele cerești, minte îngerească, stea cu totul luminoasă și mai sfântă decât toți sfinții; împărăteasa împăraților, stăpâna tuturor făpturilor, Fecioară încuviințată de Dumnezeu, Mireasă nestricată, palat al Preasfântului Duh, tron de foc al Împăratului celui nevăzut, chivot ceresc, purtător al Cuvântului lui Dumnezeu, căruța cea în chipul focului; odihna Dumnezeului celui viu, zămislirea negrăită a trupului lui Hristos, cuibul Vulturului ceresc, turtureaua cea cu bună glăsuire, porumbița cea preabună, lină și fără de răutate; Maică iubitoare de fii, adâncul milelor, picătura care risipești mânia lui Dumnezeu, adâncimea cea nemăsurată, taina cea negrăită, minunea cea neștiută, minune nespusă;","Biserică nefăcută de mână omenească a Însuși Împăratului tuturor veacurilor; tămâia cea cu bun miros, veșmânt cinstit, porfiră de Dumnezeu țesută, Rai sufletesc, odrasla pomului celui de viață purtător, floarea cea preafrumoasă, care ai înflorit nouă veselia cerească, strugurele mântuirii noastre, paharul Împăratului Ceresc, întru care s-a dres de la Duhul Sfânt vinul harului Celui neîmpuținat; solitoarea legii, începătura credinței celei adevărate a lui Hristos, turnul cel neclintit, pieirea ereticilor, sabia mâniei lui Dumnezeu împotriva tuturor celor nelegiuiți; îngrozire diavolilor, biruință în războaie, păzitoare adevărată tuturor creștinilor și lumii încredințată mântuire.","O, întru tot milostivă Doamnă Fecioară, stăpână Născătoare de Dumnezeu, auzi-ne pe noi cei ce ne rugăm ție și arată mila ta poporului drept-credincios; roagă pe Fiul tău să ne izbăvească de tot răul. Și păzește locașul acesta și toate orașele și satele creștinești și tot poporul cel bine-credincios, care scapă la tine și cheamă numele tău cel sfânt, de toate năpastele, de boală, de cutremur, de potop, de foc, de sabie, de venirea altor neamuri asupra noastră și de războiul cel dintre noi, de toate durerile și tot necazul. Ca să nu fie împuținați robii tăi nici cu răni, nici cu îngrozire, nici cu moarte, nici cu dreapta mânie a lui Dumnezeu; ci îi păzește și îi mântuiește cu mila ta, Doamnă, ceea ce te rogi pentru noi și pentru buna întocmire a văzduhului, spre vremi aducătoare de roadele cele de folos, pe care le dăruiești nouă. Izbăvește, ridică și miluiește din toate nevoile, stăpână preamilostivă, Născătoare de Dumnezeu prealăudată, pe cei ce sunt în primejdii. Adu-ți aminte de robii tăi și nu trece cu vederea lacrimile și suspinarea lor; ci ne înnoiește pe noi cu bunătatea ta, ca să ne mângâiem cu mulțumire, aflându-te pe tine ajutătoare. Milostivește-te, Doamnă Preacurată, spre ajutorul poporului celui binecredincios.","Nădejdea noastră, adună pe cele risipite: pe cei rătăciți pe cale povățuiește-i, pe cei căzuți de la dreapta credință iarăși la credință întoarce-i, pe cei bătrâni sprijinește-i, pe cei tineri îi învață, pe prunci hrănește-i și preamărește pe cei ce te preamăresc; dar, mai ales, păzește Sfântă Biserica Fiului tău și o ferește întru lungime de zile.","O, milostivă și preaîndurată împărăteasă a cerului și a pământului, Născătoare de Dumnezeu, pururea Fecioară, miluiește cu mijlocirea ta poporul drept-credincios și toată drept-credincioasa creștinătate. Păzește-o sub acoperământul milei tale, apăr-o pe ea cu cinstitul tău acoperământ și roagă pe Hristos, Dumnezeul nostru, pe Care mai presus de fire L-ai întrupat, să ne încingă pe noi cu putere de sus, ca să ne putem apăra împotriva vrăjmașilor ce se luptă împotriva noastră. Miluiește și mântuiește prin rugăciunile tale, Maică, pe Prea Fericitul Părintele nostru (N), Patriarhul Bisericii Ortodoxe Române, pe (Înalt) Prea Sfințitul (Arhi-) Episcopul (și Mitropolitul) nostru (N), pe toți ortodocșii arhierei, preoți și diaconi și pe tot clerul bisericesc și pe tot poporul drept-credincios care se închină icoanei tale.","Caută spre noi toți cu folosința ta cea preamilostivă, ridică-ne pe noi din adâncul păcatelor și ne luminează ochii inimii spre căutarea mântuirii. Milostivă fii nouă aici, iar la înfricoșătoarea Judecată, pe Fiul tău pentru noi roagă-L. Pe cei care s-au mutat întru dreaptă credință, din această viață în cea veșnică, împreună cu îngerii, cu arhanghelii și cu toți sfinții, împărtășește-i ca să stea de-a dreapta Fiului tău și Dumnezeu; și prin rugăciunea ta învrednicește pe toți ortodocșii creștini să viețuiască cu Hristos, și cu bucurie în locașurile îngerești să se desfăteze.","Că tu ești, Doamnă, slavă a celor cerești și ajutătoare a pământenilor; tu ești nădejdea și folositoarea tuturor celor ce aleargă la tine și cer ajutorul tău cel sfânt; tu ești rugătoarea cea fierbinte către Fiul tău și Dumnezeul nostru, că rugăciunile Maicii mult pot spre îmblânzirea Stăpânului. Și, cu a ta mijlocire, îndrăznim să ne apropiem de sfântul altar, de harul preasfintelor și de viață făcătoarelor Taine, deși suntem nevrednici. Pentru aceea, și pe icoană văzând chipul tău cel întru tot cinstit și pe Cel Atotțiitor cu mâna ținând, ne bucurăm noi păcătoșii și, cu umilință căzând, pe acesta cu dragoste și cu frică îl sărutăm, așteptând, Doamnă, prin sfintele și de Dumnezeu primitele tale rugăciuni, să ajungem la cele cerești ale vieții celei fără de sfârșit, și să stăm fără de rușine în ziua Judecății de-a dreapta Fiului tău și Dumnezeului nostru, slăvindu-L pe El împreună cu Cel fără de început al Lui Părinte și cu Preasfântul și Bunul și de viață făcătorul Lui Duh, acum și pururea și în vecii vecilor. Amin.","Slavă Tatălui și Fiului și Sfântului Duh, și acum și pururea și în vecii vecilor! Amin. Doamne, miluiește! Doamne, miluiește! Doamne, miluiește! Pentru rugăciunile Preasfintei Născătoare de Dumnezeu și pururea Fecioarei Maria, și cu ale tuturor sfinților, Doamne Iisuse Hristoase, Fiul lui Dumnezeu, miluiește-ne pe noi!"],"r":[]}]},{"slug":"ioachim-ana","title":"Acatistul Sfinților Părinți Ioachim și Ana","short":"Sf. Ioachim și Ana","source":"https://doxologia.ro/acatistul-sfintilor-parinti-ioachim-ana","sections":[{"h":"Condacul 1","p":["Însoțirii celei de Dumnezeu alese, dumnezeieștilor Părinți Ioachim și Ana, ca celor ce ați născut pe Maica Vieții noastre, binecuvântata de Dumnezeu Născătoarea și Pururea Fecioara Maria, cântări de laudă aducem vouă noi, rugătorii voștri; iar voi, ca cei ce aveți îndrăzneală către Dumnezeu, păziți-ne cu rugăciunile voastre de toate primejdiile pe noi, cei ce cântăm: Bucurați-vă, Părinți de trei ori fericiți!"],"r":[]},{"h":"Icosul 1","p":["Îngerul cel mai întâistătător din cer a fost trimis să spună vestirea de bucurie Dreptului Ioachim, zicând: „Ioachime, Ioachime, auzitu-s-a rugăciunea ta; și iată, femeia ta va naște ție o fiică de care cerul și pământul se vor bucura”, lăudându-te pe tine și zicând:\nBucură-te, Ioachime, mângâierea lui Adam celui căzut;\nBucură-te, mijlocitorul iertării celui greșit;\nBucură-te, că rugăciunile tale au străbătut cerurile;\nBucură-te, că darul cel mai presus de lume ai dobândit;\nBucură-te, că de aceasta Anei grăbindu-te ai vestit;\nBucură-te, că și acesteia, de asemenea, i s-au descoperit;\nBucură-te, luminătorul cel cu raze veselitoare;\nBucură-te, aducătorule de roadă mântuitoare;\nBucură-te, că ai odrăslit din seminție împărătească;\nBucură-te, că ai mărit vrednicia arhierească;\nBucură-te, cel ce ai întrecut cu darul pe Avraam;\nBucură-te, cel prin care întristarea nerodirii s-a pierdut;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul al 2-lea","p":["Văzându-se Dreptul Ioachim defăimat din pricina nerodirii, s-a depărtat în pustie, cu post și cu lacrimi rugându-se lui Dumnezeu, de la Care câștigând darul cel mai presus de lume, s-a bucurat cântând: Aliluia!"],"r":[]},{"h":"Icosul al 2-lea","p":["Sfatul cel mai înainte de veci venind să se plinească, a fost trimis de la Dumnezeu Arhanghelul cel mai întâistătător să vestească bucurie Sfintei și Dreptei Ana, zicând: „Ana, Ana, s-a auzit rugăciunea ta; și iată, vei naște pe Născătoarea de Dumnezeu Maria, prin care lumea se va mântui”, lăudându-te pe tine și zicând:\nBucură-te, Ana, așteptarea cea mult dorită de strămoașa Eva;\nBucură-te, lună care ai risipit negura întristării;\nBucură-te, grădină de Dumnezeu sădită;\nBucură-te, că ai odrăslit floarea cea neveștejită;\nBucură-te, că de nașterea ta lumea s-a bucurat;\nBucură-te, că prin tine stârpiciunea s-a dezlegat;\nBucură-te, ceea ce ai hrănit pe hrănitoarea Vieții;\nBucură-te, mângâierea celor necăjiți;\nBucură-te, bogăția celor lipsiți;\nBucură-te, că prin tine s-a făcut începătura darului;\nBucură-te, că prin nașterea ta s-a stins datoria păcatului;\nBucură-te, Ana, maică prealăudată!"],"r":[]},{"h":"Condacul al 3-lea","p":["Văzându-se pe sine Sfânta și Dreapta Ana întru întristarea nenașterii de prunci, plângând cu amar în grădina sa, se ruga lui Dumnezeu, zicând: „Doamne al Puterilor, Cel ce știi ocara nerodirii, dezleagă-mi stârpiciunea, că roada pântecelui meu în dar o aduc ție”, lăudându-Te și cântând: Aliluia!"],"r":[]},{"h":"Icosul al 3-lea","p":["Alergat-a Ioachim în Ierusalim la Biserica Domnului, după ce i-a grăit lui Arhanghelul, și aflând pe soția sa, i-a spus vestirea cea de bucurie; și au mulțumit împreună lui Dumnezeu pentru mila aceasta, pentru care și noi îl lăudăm pe dânsul, zicând:\nBucură-te, bătrânule de Dumnezeu iubit;\nBucură-te, Prealăudate Părinte al Maicii lui Dumnezeu;\nBucură-te, sfeșnicul lui Dumnezeu cel în fapte bune îmbătrânit;\nBucură-te, cel ce din coapsele tale ai îmbogățit lumea;\nBucură-te, pomul psalmistului ale cărui frunze nu au căzut;\nBucură-te, că întru tine s-a plinit proorocirea;\nBucură-te, cu tu pe toți părinții ai întrecut;\nBucură-te, că te-ai învrednicit a fi părinte Maicii lui Dumnezeu;\nBucură-te, rădăcina sadului celui dumnezeiesc;\nBucură-te, că ai odrăslit din neamul împărătesc;\nBucură-te, că ai bineplăcut lui Dumnezeu pe pământ;\nBucură-te, că ai împodobit Ierusalimul cel de sus cu odrasla ta;\nBucură-te, Ioachime, părinte preafericite!"],"r":[]},{"h":"Condacul al 4-lea","p":["Înțelegând bătrânul sfatul lui Dumnezeu pentru răscumpărarea neamului omenesc, intrând în biserică împreună cu soția sa, cea de Dumnezeu înțelepțită, și închinându-se, a cântat laudă: Aliluia!"],"r":[]},{"h":"Icosul al 4-lea","p":["Auzind rudeniile Dumnezeieștilor Părinți că a mărit Domnul mila Sa față de dânșii, au alergat lăudând într-un glas pe preaînțeleapta Ana, zicând:\nBucură-te, ceea ce ai prefăcut în bucurie lacrimile Evei;\nBucură-te, că întru nașterea ta îngerii dănțuiesc întru veselie;\nBucură-te, corabia care porți pe porumbița ce vestește încetarea potopului;\nBucură-te, măslin plin de roadă în casa Domnului;\nBucură-te, ceea ce porți scaunul împăratului;\nBucură-te, că prin nașterea ta se surpă împărăția iadului;\nBucură-te, țarină bine roditoare;\nBucură-te, holdă hrănitoare a săracilor;\nBucură-te, podoaba și lauda maicilor;\nBucură-te, ajutătoarea și mângâierea celor sterpe;\nBucură-te, cămara împărătesei îngerilor;\nBucură-te, vistieria mângâierii celor păcătoși;\nBucură-te, Ana, maică prealăudată!"],"r":[]},{"h":"Condacul al 5-lea","p":["Steaua cea cu strălucire dumnezeiască răsărind din pântecele tău cel preafericit, Ana de Dumnezeu iubită, vestește bucurie la toată lumea și pe toți îi îndeamnă a cânta cu un glas: Aliluia!"],"r":[]},{"h":"Icosul al 5-lea","p":["Văzând Dumnezeu-Cuvântul zidirea Sa chinuită de tiranul diavol și voind a-Și pregăti pe pământ cămară însuflețită, pe tine, Ioachim, te-a chemat la o vrednicie ca aceasta, ca din coapsele tale să răsară Mireasa cea Preacurată; pentru aceasta grăim ție:\nBucură-te, sadul creștinătății cel preastrălucit;\nBucură-te, începătorul darului cel preamărit;\nBucură-te, că din sămânța ta s-a lucrat cortul cel însuflețit;\nBucură-te, c
